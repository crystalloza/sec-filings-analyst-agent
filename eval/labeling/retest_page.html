l Condition and Results of Operations,\" or MD&A, and such other risks and uncertainties as set forth below in this report or detailed in our other Securities and Exchange Commission (SEC) reports and filings. We assume no obligation to update forward-looking statements.\n\nAdditionally, we make certain voluntary disclosures in this report and on our website, which are informed by various standards and frameworks (including standards for the measurement of underlying data), and the interests of various stakeholders. As such, these voluntary disclosures may not necessarily be \"material\" under the federal securities laws for SEC reporting purposes. Furthermore, much of this information is subject to methodological considerations or information, including from third-parties, that is still evolving and subject to change, and which AMD does not independently verify. For example, our disclosures based on any standards may change due to revisions in framework requirements, availability of information, changes in our business or applicable government policies, or other factors, some of which may be beyond our control.\n\nTable of Conten t s\n\nReferences in this Annual Report on Form 10-K to \"AMD,\" \"we,\" \"us,\" \"management,\" \"our\" or the \"Company\" mean Advanced Micro Devices, Inc. and our consolidated subsidiaries.\n\n## Overview\n\nAMD drives innovation in high performance and AI computing to solve the world's most important challenges. AMD technology powers billions of experiences across cloud and AI infrastructure, embedded systems, AI PCs and gaming. With a broad portfolio of AI-optimized CPUs, GPUs, networking and software, AMD delivers full-stack solutions that help customers turn data into breakthroughs, with the speed and scale needed for a new era of intelligent computing. Our high-performance product portfolios provide differentiated solutions, including semi-custom System-on-Chip (SoCs), adaptive SoCs and accelerated processing units (APUs). For data centers, we offer AI accelerators, microprocessors (CPUs), graphic processing units (GPUs), data processing units (DPUs), AI Network Interface Cards (AI NICs) and field programmable gate arrays (FPGAs). We offer ultra-low latency networking solutions. We also offer data center rack-scale platform designs that incorporate AMD data center products to meet the growing performance demands of AI supercomputers and machine learning workloads. In client computing, our CPUs, APUs and chipsets for desktops and notebooks deliver performance, efficiency, AI capabilities and modern security features for gamers, creators, consumers and enterprises. AMD was the first company to integrate a dedicated neural processing unit (NPU) on the same SoC as an x86 CPU for AI PCs. By bringing NPU\u2010accelerated AI capabilities directly into mainstream x86 platforms, we established a differentiated technology footprint that supports a growing ecosystem of AI\u2010enabled applications and lays the groundwork for the multi\u2010generation RyzenTM AI roadmap that continues to expand our leadership. Our GPUs, including discrete GPUs and semi-custom SoCs, are combined with software to power immersive gaming experiences across PCs, game consoles and cloud gaming services. Our embedded computing portfolio delivers high-performance, scalable solutions across CPUs, APUs, FPGAs, System-on-Modules (SOMs) and adaptive SoCs for markets such as automotive, industrial, healthcare, storage and networking with integrated AI processing capabilities.\n\nWe develop comprehensive software stacks that include development tools, compilers and drivers to enable our high-performance CPUs, APUs, GPUs and FPGAs. We have a comprehensive and open AI software stack to support the diverse set of AI ecosystems across frameworks, large and small language models and applications. By working closely with customers, we deliver customized solutions that meet their evolving needs, leveraging our broad IP portfolio and leadership in design, integration and advanced packaging. Our investments in technologies such as our custom-ready chiplet platform and AMD Infinity FabricTM switch position us to maintain our leadership as a custom-design silicon provider of choice.\n\n## Our Strategy\n\nWe believe AI is shaping the next era of computing and its full potential will be realized when it becomes pervasive across cloud, edge and endpoint devices. With our compute engines, intellectual property, software enablement and deep expertise, AMD is positioned to lead in this next computing era. Our broad portfolio spans supercomputing, cloud, edge, embedded and end devices, providing the unique opportunity to make AMD the end-to-end AI leader.\n\nIn 2025, a key priority was accelerating growth in our Data Center segment. Demand for our data center AI accelerator products was strong as large hyperscale customers, OEMs and ODMs deployed our AMD InstinctTM MI350X Series GPUs. We advanced our AMD AI GPU roadmap to deliver an annual cadence of leadership for AMD Instinct solutions, beginning with the AMD Instinct MI350 Series GPUs in 2025. Beyond GPUs, we launched the 5th Gen AMD EPYCTM family of server processors in 2025, which deliver leadership performance and capabilities for a wide range of data center workloads, including AI. In addition, we previewed our \"Helios\" AI rack-scale platform solution that incorporates all of our data center products (CPUs, GPUs and Networking) to address the growing AI compute requirements.\n\nWe strengthened our AI leadership through a number of strategic acquisitions during the year. In March 2025, we acquired ZT Group Int'l, Inc. (ZT Systems), where we retained certain intellectual property and employees associated with the design operations (ZT Design Business). This acquisition enables us to deliver end-to-end AI solutions and accelerate the design and deployment of AMD-powered AI infrastructure at scale optimized for the cloud. In October 2025, we sold the ZT data center infrastructure manufacturing business (ZT Manufacturing Business) to Sanmina Corporation (Sanmina). We made other strategic acquisitions during the year to advance our software capabilities and enable highly optimized solutions across the stack, support co-packaged optics solutions for next-generation AI systems, and bring deep expertise in high-speed inference and reasoning-based AI technologies for large-scale deployments.\n\nTable of Conten t s\n\nWe believe that AI systems will require not only powerful chips, but also full-stack innovation across compute, networking, systems architecture and software. AMD is uniquely positioned to deliver across this stack, combining industry-leading CPUs, GPUs and adaptive SoCs with networking, software and system integration expertise. We continue to invest in software capabilities and the open ecosystem through the AMD ROCmTM platform, delivering new features for high-performance AI training and inference. In 2025, we introduced key optimizations and expanded support for frameworks and libraries, improving performance for generative AI workloads and simplifying the developer experience.\n\nIn October 2025, we entered into a product purchase agreement with OpenAI OpCo, LLC, (OpenAI) to deploy 6 gigawatts of AMD GPUs, with the deployment of the first gigawatt of capacity powered by our AMD Instinct MI450 series products. This multiyear strategic partnership with OpenAI demonstrates our continued execution of hardware, software and full-stack solutions roadmaps.\n\n## Our Business\n\nBeginning in the first quarter of fiscal year 2025, we combined the Client and Gaming segments into one reportable segment to align with how we manage our business. All prior period segment data were retrospectively adjusted.\n\nOur three reportable segments are:\n\n\u2022 the Data Center segment, which primarily includes AI accelerators, CPUs for servers, GPUs, APUs, DPUs, AI NICs, FPGAs and SoC products for data centers;\n\n\u2022 the Client and Gaming segment, which primarily includes CPUs, APUs, chipsets for desktops and notebooks, discrete GPUs, and semi-custom SoC products and development services; and\n\n\u2022 the Embedded segment, which primarily includes embedded CPUs, APUs, FPGAs, SOMs, and adaptive SoC products.\n\nFrom time to time, the Company may also sell or license portions of its IP portfolio.\n\nIn addition to these reportable segments, we have an All Other category, which is not a reportable segment.\n\n## Data Center Market\n\nThe Data Center segment primarily includes server-class CPUs, GPUs, AI accelerators, DPUs, AI NICs, FPGAs, and adaptive SoC products. We leverage our technology to address the computational, visual data processing and AI workload acceleration needs in the data center market. Modern data centers require high performance, energy efficient, scalable and adaptable compute engines to meet the demand driven by the growing amount of data that needs to be stored, accessed, analyzed and managed. Different combinations of CPUs, GPUs, DPUs, AI NICs, FPGAs and adaptive SoCs enable the optimization of performance and power for a diverse set of workloads.\n\n## Data Center Products\n\nServer CPUs. Our CPUs for server platforms currently include the AMD EPYCTM Series processors. EPYC CPUs, which are based on the x86 architecture, are server-specific processors designed for high-performance computing, enterprise IT, supercomputing, and large data centers. Our 5th generation AMD EPYC family of server processors delivers improved performance and efficiency for AI, cloud and enterprise workloads.\n\nData Center GPUs. Our AMD InstinctTM family of GPU products, including AMD Instinct MI200, MI300, MI325 and MI350 series, are based on AMD CDNATM architecture and designed for AI training, inference and exascale-class scientific computing. We also announced next-generation AMD Instinct MI355X GPUs for large-scale AI deployments. Our visual cloud GPU offerings include products in the AMD RadeonTM PRO V families. Our visual cloud data center GPUs include a range of solutions tailored towards workloads requiring remote visualization, such as Desktop-as-a-Service, Workstation-as-a-Service and Cloud Gaming.\n\nFPGAs and Adaptive SoCs. We offer a wide range of FPGAs, adaptive SoCs and acceleration cards for the data center. Devices include the VirtexTM, KintexTM, ArtixTM, and SpartanTM FPGA products, as well as ZynqTM and VersalTM adaptive SoCs. Our AlveoTM accelerator cards provide a platform for accelerating multiple data center workloads at the edge or in the cloud.\n\nTable of Conten t s\n\nNetworking Products. Our AMD PensandoTM DPUs and comprehensive networking software stack offload data center infrastructure services from the host CPU and are used by large Infrastructure as a Service (IaaS) cloud providers to accelerate workload performance for hosted virtualized and bare-metal offerings. We introduced our AMD Pensando \"Pollara\" 400 AI NICs and \"Vulcano\" AI NICs, which deliver high-speed connectivity across GPU clusters providing high-performance, AI-ready, flexible solutions for scale-out networking.\n\nThe AMD SolarflareTM portfolio continues to offer low latency networking solutions for capital markets, including hardware adapters and the OnloadTM user space networking libraries.\n\n## Client Market\n\nOur CPUs and APUs power PCs that are an integral part of how customers work, learn and play. The Client market encompasses the global personal computing ecosystem, including desktop and notebook PCs sold primarily through OEMs, distributors and select direct customers. Our products consist mainly of x86 CPUs and APUs marketed under the AMD RyzenTM and AMD RyzenTM AI brands for consumer, commercial and enthusiast segments. Our customers focus on a combination of performance, efficiency, reliability, and value that aligns with their specific use cases. We built a leadership roadmap across these areas and are continuing to further differentiate end user experiences by infusing AI across our portfolio.\n\n## Client Products\n\nDesktop CPUs. Our desktop CPU and APU offerings include the AMD RyzenTM and AMD Ryzen ThreadripperTM processors. The Ryzen 9000 Series processors feature \"Zen 5\" cores, along with X3D models featuring 2nd generation AMD 3D V-CacheTM technology for leadership gaming performance. In 2025, we launched processors for gaming and content creation with Ryzen 9 9950X3D and Ryzen 9 9900X3D. In January 2026, we announced the Ryzen 7 9850X3D, in addition to our Ryzen 7 9800X3D series. Our Ryzen ThreadripperTM 9000 Series processors for professional workstations feature increased core counts, expanded memory bandwidth and updated platform capabilities. Our portfolio also includes a broad range of Ryzen 9000 and Ryzen series desktop processors featuring a wide range of capabilities and price points for the growing Socket AM5 platform. In 2025, we released additional AMD Ryzen G Series processors with integrated advanced graphics to extend the longevity of the Socket AM4 platform.\n\nNotebook CPUs. Our latest mobile processors are designed to deliver premium laptop experiences with local AI. In 2025, we launched AMD Ryzen AI 300 Series processors featuring a next generation NPU supporting Microsoft Copilot+ PCs, our latest \"Zen 5\" architecture and our AMD RDNATM 3.5 graphics architecture. In January 2026, we launched our Ryzen AI 400 series processors, the next generation of processors for AI PCs. Building on our AI PC momentum, we expanded our portfolio by introducing Ryzen AI-powered platforms across notebooks and mini desktops and introduced a new reference platform for AI developers in January 2026, the Ryzen AI Halo, that features up to 128GB of memory for large AI model support. We also expanded the Ryzen AI Max processor lineup with the Ryzen AI Max+392 and Ryzen AI Max+388 to enable wider price points for our maximum GPU configurations. Our AMD Ryzen 8000 Series mobile processors, built on the \"Zen 4\" architecture feature our first generation NPU, and our Ryzen 10 and 100 series mobile processors, powered by both our \"Zen 2\" and \"Zen 3+\" core architectures, all address mainstream consumer and commercial markets. For handheld gaming systems, our Ryzen Z1 Series continues to deliver immersive experiences, and we introduced the Ryzen Z2 Series, bringing higher efficiency and improved graphics performance for portable gaming devices including the new Asus ROG Xbox Ally.\n\nTable of Conten t s\n\nCommercial CPUs. AMD Ryzen PRO solutions deliver enterprise-class security, manageability, and reliability for commercial client PCs including business notebooks, desktops, and workstations. In 2025, we reinforced our leadership in commercial computing with new Ryzen PRO offerings that integrate AI capabilities, delivering performance, mobility, and enterprise features for our customers. Our AMD Ryzen AI PRO 300 Series, brings world-class security and manageability, with leadership productivity, battery life and AI capabilities to business notebooks and mobile workstations. With the announcement of our Ryzen AI 400 PRO Series, we continued to expand our next gen AI PC leadership and offerings. In 2025, we also launched the AMD Ryzen PRO 200 Series mobile processors that expand our commercial CPU portfolio enabling high performance PCs spanning a range of price points. For desktops, the AMD Ryzen PRO 8000G Series desktops offer an integrated AI solution for enterprises, and our AMD Ryzen Threadripper PRO CPU enables leadership performance, expanded memory bandwidth and platform reliability for premium workstations.\n\nChipsets. We offer a full suite of chipset products to support our AMD Ryzen and AMD Ryzen Threadripper platforms, for entry level through professional workstation desktop systems. These chipsets complement our latest CPU innovations, supporting robust connectivity and scalability for diverse client computing needs.\n\n## Graphics Market\n\nGraphics processing is a fundamental component across many of our products. Our customers generally use our graphics solutions to enable immersive visualization and to process AI/ML based workloads. We develop our graphics products for use in various computing devices and entertainment platforms, including data centers, desktop PCs, notebook PCs, handheld devices, All-in-Ones and professional workstations. In addition, we leverage our core IP, including graphics and processing technologies, to develop semi-custom solutions deeply co-engineered with our customers, which has enabled many of today's leading gaming consoles and handheld gaming products.\n\nSemi-Custom Products. Our semi-custom products are tailored, high-performance, customer-specific solutions based on CPU, GPU and multi-media technologies. We work closely with our customers to define solutions precisely matching their system requirements. AMD semi-custom SoC products power the Sony PlayStation \u00ae 5, the Microsoft \u00ae Xbox Series STM and XTM game consoles, as well as the recently revealed Valve Steam Machine PC.\n\nDiscrete Desktop and Notebook GPUs . Our AMD Radeon RX discrete GPU processors for PCs power the latest gaming and creation platforms. In 2025, we released our Radeon RX 9000 Series graphics cards, based on a new AMD RDNATM 4 architecture, designed for increased AI performance, new levels of ray tracing capabilities and enhanced performance per watt to deliver new levels of performance for gamers and creators. All of our graphics products are supported by the AMD software: Adrenalin EditionTM application, which is regularly enhanced to provide the latest in performance, features, and stability. We also released FSR \"Redstone\" gaming technologies to integrate Machine Learning for improved performance and visuals on our Radeon RX 9000 graphics cards.\n\nProfessional GPUs. Our AMD Radeon PRO family of professional graphics products are designed for integration in desktop workstations, optimized through hardware and software for demanding use cases such as 3D rendering, design and manufacturing for Computer-Aided Design (CAD), and media and entertainment for broadcast and animation pipelines on high resolution displays. In 2025, we launched our Radeon AI PRO R9000 Series of graphics cards, intended for local AI inference and creative workloads enabling professionals to accelerate AI-driven content creation and advanced visualization tasks directly on their workstation.\n\nTable of Conten t s\n\n## The Embedded Market\n\nThe Embedded segment primarily includes embedded CPUs, APUs, FPGAs, and adaptive SoC products. Embedded products address computing needs in aerospace and defense, automotive, industrial, vision and healthcare, communications infrastructure, test and measurement, emulation and prototyping, audio, video and broadcasting, and data center. Typically, our embedded products are used in applications that require varying levels of performance, where key features may include relatively low power, small form factors, and 24x7 operations. High-performance graphics are important in some embedded systems. Support for Linux \u00ae , Windows \u00ae and other operating systems as well as for increasingly sophisticated applications are also critical for some customers. Other requirements may include meeting rigid specifications for industrial temperatures, shock, vibration and reliability. The embedded market has moved from developing proprietary, custom designs to leveraging industry-standard instruction set architectures and processors to help reduce cost and speed time to market.\n\n## Embedded Products\n\nEmbedded CPUs and APUs . Our embedded portfolio expanded in 2025 with the introduction of three new AMD EPYC embedded processor series: AMD EPYC Embedded 9005 Series, EPYC Embedded 4005 Series processors and EPYC Embedded 2005 Series. These new series deliver enhanced performance and extended lifecycles for networking, storage, and edge server applications. We also launched the AMD Ryzen Embedded 9000 Series processors, offering performance-per-watt and low latency for automation systems and machine vision applications. In January 2026, we introduced a new family of Ryzen AI Embedded series processors with two new series: the Ryzen AI Embedded P100 and Ryzen AI Embedded X100 Series. These additions complement our existing AMD EPYC Embedded CPUs and AMD Ryzen Embedded Series processors including V-Series APUs and CPUs and R-Series APUs and CPUs. Our embedded solutions are designed to support high performance compute, high-bandwidth network connectivity and security, high-performance storage requirements for enterprise and cloud infrastructure, 3D graphics performance and 4K multimedia requirements of automotive infotainment systems.\n\nFPGAs and Adaptive SoCs. O ur FPGA products are hardware-customizable devices that can be tailored to meet the specific needs of each customer, enabling them to differentiate their products and accelerate time to market. Our FPGA families include AMD UltraScale+TM, UltraScaleTM 7 Series, and other earlier series. Adaptive SoC products include the AMD ZynqTM SoC and Zynq UltraScale+ Multi-Processing System-on-a-Chip (MPSoC), which combine FPGA technology with a heterogeneous processing system, as well as the industry's first RFSoC architecture with integrated radio frequency (RF) data converters (Zynq UltraScale+ RFSoC and Zynq RFSoC DFE). The AMD VersalTM portfolio, composed of software-programmable adaptive SoCs, is a heterogeneous compute platform that combines a processing system, programmable logic, AI Engines, and digital signal processing (DSP) Engines. The Versal devices achieve dramatic system-level performance improvements over today's fastest FPGA competitors' solutions and accelerate applications in a wide variety of markets, including aerospace and defense, automotive, industrial, vision and healthcare, communications infrastructure, test and measurement, emulation and prototyping, audio, video and broadcasting, and data center. Our Versal RF Series delivers compute performance for aerospace and defense applications. We introduced our Versal Premium Series Gen 2, the first adaptive compute devices supporting next-generation CXL\u00ae and PCIe\u00ae connectivity.\n\nDevelopment Boards, Kits and Configuration Products. We offer development kits for all our FPGA and adaptive SoCs. These kits include hardware, development tools, IP, and reference designs that streamline and accelerate the development of domain-specific and market-specific applications. We continue to enhance developer productivity with expanded support for AMD KriaTM SOMs and starter kits, enabling rapid prototyping and deployment for motor control and edge AI applications. Our Kria K24 SOM provides high determinism and low latency for powering electric drives and motor controllers used in compute-intensive DSP applications at the edge. Coupled with our Kria KD240 Drives Starter Kit, an out-of-the-box-ready motor control-based development platform, the products offer a seamless path to production deployment.\n\nTable of Conten t s\n\n## Design Platforms and Services\n\nAdaptable Platforms. We offer two types of platforms that support our customers' designs and reduce their development efforts: FPGAs and adaptive SoCs. FPGAs feature reconfigurable hardware as well as integrated memory, DSP, analog mixed signal, high-speed serial transceivers and networking cores coupled with advanced software for a broad range of applications in all of our end markets. Our adaptive SoCs feature a heterogeneous processing system with integrated programmable hardware fabric targeting embedded systems that need real-time control, analytics, sensor fusion and adaptable hardware for differentiation and acceleration. Our Zynq UltraScale+ RFSoCs feature integrated high-performance RF data converters targeting wireless, radar and cable access applications. Enabled by both hardware and software design tools and an extensive operating system, middleware, software stack and IP ecosystem, adaptive SoCs target software developers as well as traditional hardware designers. Our Versal portfolio combines a processing system, programmable logic, AI Engines, and DSP Engines with leading-edge memory and interfacing technologies to deliver powerful heterogeneous acceleration for any application. This product portfolio is ideally suited to accelerate a broad set of applications in the emerging era of big data and AI.\n\nSoftware Development Platform. Our AMD VivadoTM Design Suite provides hardware design teams with the tools and methodology needed to program FPGAs and adaptive SoCs. Our VitisTM unified software platform enables the development and deployment of embedded software and accelerated applications on our FPGAs and adaptive SoCs. Our Vitis AI unified software platform enables the development and deployment of AI software on our FPGAs and adaptive SoCs.\n\n## Sales and Marketing\n\nWe sell our products via a direct sales force, our OEMs (as described in detail below) and through independent distributors and sales representatives in both domestic and international markets. Our sales arrangements generally operate on the basis of product forecasts provided by the particular customer, but do not typically include any commitment or requirement for minimum product purchases. We use purchase orders and related documents, and contractual agreements as evidence of our sales arrangements. Our agreements typically contain standard terms and conditions covering matters such as payment terms, warranties and indemnities for issues specific to our products.\n\nWe generally warrant that our products sold to our customers will conform to our approved specifications and be free from defects in material and workmanship under normal use and conditions for one year. We offer up to three-year limited warranties for certain product types and sometimes provide other warranty periods based on negotiated terms with certain customers.\n\nWe market and sell our latest products under the AMD trademark.\n\nOur product brand for server microprocessors is AMD EPYCTM processors.\n\nOur product brands for data center graphics are AMD InstinctTM accelerators and AMD RadeonTM PRO V Series.\n\nOur product brands for data center networking are AMD PensandoTM Pollara 400 AI NIC and AMD Pensando Salina DPU.\n\nOur product brand for low-latency adapters for FinTech is AMD SolarflareTM adapters.\n\nOur client product brands for desktop and notebook PCs include: AMD RyzenTM, AMD RyzenTM AI, AMD RyzenTM PRO, AMD RyzenTM ThreadripperTM, AMD RyzenTM ThreadripperTM PRO, AMD AthlonTM, and AMD PRO A-Series processors.\n\nOur product brand for the consumer graphics market is AMD RadeonTM graphics, and AMD Embedded Radeon graphics is our product brand for the embedded graphics market.\n\nOur product brand for professional graphics products is AMD RadeonTM PRO graphics.\n\nWe also market and sell our chipsets under AMD trademarks.\n\nOur FPGA products are VirtexTM 6, Virtex 7, Virtex UltraScale+, KintexTM 7, Kintex UltraScaleTM, Kintex UltraScale+, ArtixTM 7, Artix UltraScale+, SpartanTM 6, and Spartan 7 brands.\n\nTable of Conten t s\n\nOur product brands for adaptive SoCs are ZynqTM 7000, Zynq UltraScale+TM MPSoC, Zynq UltraScale+ RFSoCs, VersalTM HBM, Versal Premium, Versal Prime, VersalTM AI Core and Versal AI Edge.\n\nThe software tools for our programmable devices are VitisTM, Vitis AITM, and VivadoTM tools.\n\nOur System-on-Module (SOM) product is the KriaTM brand.\n\nWe also sell low-power versions of our AMD AthlonTM, as well as AMD GeodeTM, AMD RyzenTM, AMD EPYCTM,\n\nAMD R Series and G Series processors as embedded processor solutions.\n\nOur compute and network acceleration board products are sold under the AlveoTM and PensandoTM brands.\n\nWe market our products through direct marketing and co-marketing programs. In addition, we have cooperative advertising and marketing programs with customers and third parties, including market development programs, pursuant to which we may provide product information, training, marketing materials and funds. Under our co-marketing development programs, eligible customers can use market development funds as reimbursement for advertisements and marketing programs related to our products and third-party systems integrating our products, subject to meeting defined criteria.\n\n## Customers\n\nOur Data Center Segment customers consist primarily of hyperscale data centers, original equipment manufacturers (OEMs), original design manufacturers (ODMs), system integrators and independent distributors in both domestic and international markets. ODMs provide design and/or manufacturing services to branded and unbranded private label resellers, OEMs and system builders.\n\nOur Client and Gaming Segment customers consist primarily of PC OEMs, a network of independent distributors and, for chipset products, ODMs that manufacture motherboards. PC OEMs and independent distributors as well as add-in-board manufacturers (AIBs), independent game console and portable gaming devices manufacturers and contract manufacturers for AMD branded graphics cards.\n\nOur Embedded Segment products are sold to customers in a very wide range of markets such as aerospace and defense, automotive, industrial, vision and healthcare, communications infrastructure, test and measurement, emulation and prototyping, audio, video and broadcasting and data center. For these products, we either sell directly to our customers or through a network of distributors and OEM partners. We are also developing a network of Value Added Resellers (VARs) and Integrated Solution Vendors (ISVs) for our Alveo products.\n\nWe work closely with our customers to define product features, performance and timing of new products so that the products we are developing meet our customers' needs. We also employ application engineers to assist our customers in designing, testing and qualifying system designs that incorporate our products. We believe that our commitment to customer service and design support improves our customers' time to market and fosters relationships that encourage customers to use the next generation of our products.\n\nWe also work with our customers to create differentiated products that leverage our CPU, GPU, APU, DPU, AI NIC, and FPGA technology. Certain customers pay us non-recurring engineering fees for design and development services and a purchase price for the resulting products.\n\n## Original Equipment Manufacturers\n\nWe focus on three types of OEM partners: multi-nationals, selected regional accounts and selected global and local system integrators, who target commercial and consumer end customers of all sizes. Large multi-nationals and regional accounts are the core of our OEM partners' business; however, we are increasingly focused on the VAR channel, which resells OEM systems to the mid-market and the small and medium business (SMB) segments. Additionally, we have increased our focus on global system integrators, which resell OEM systems, coupled with their software and services solutions into Enterprise, High Performance Computing (HPC) and Cloud Service Provider customers. Our OEM customers include numerous foreign and domestic manufacturers of servers and workstations, desktops, notebooks, PC motherboards and game consoles.\n\nTable of Conten t s\n\n## Hyperscale Data Centers\n\nLarge multi-national public cloud service providers and hyperscale private data centers directly and indirectly purchase a substantial portion of our data center-focused products, including server CPUs, GPU accelerators, DPUs, AI NICs, FPGAs and adaptive SoCs. These products are incorporated into servers and other data center appliances sold by OEMs to the hyperscale customers or into custom servers or hardware designed by or for these customers and manufactured by ODMs or contract manufacturers. Hyperscale data centers use these products to operate web-based applications or to support public cloud computing and storage service offerings, including but not limited to AI workloads such as generative AI models.\n\n## Third-Party Distributors\n\nOur authorized channel distributors resell to sub-distributors, OEMs, ODMs and other customers. Typically, distributors handle a wide variety of products, and may include products from other manufacturers that compete with our products. Distributors typically maintain an inventory of our products. In most instances, our agreements with distributors protect their inventory of our products against price reductions and provide certain return rights with respect to any product that we have removed from our price book or are otherwise subject to discontinuation. In addition, some agreements with our distributors may contain standard stock rotation provisions permitting limited product returns.\n\n## Add-in-Board (AIB) Manufacturers and System Integrators\n\nWe offer component-level graphics and chipset products to AIB manufacturers who in turn build and sell board-level products using our technology to system integrators (SIs), retailers and sub distributors. In most instances, our agreements with AIBs protect their inventory of our products against price reductions. We also sell directly to some SI customers. SIs typically sell from positions of regional or product-based strength in the market. They usually operate on short design cycles and can respond quickly with new technologies. SIs often use discrete graphics solutions as a means to differentiate their products and add value to their customers.\n\n## Competition\n\nThe markets in which our products are sold are highly competitive and rapidly evolving and delivering the latest and best products to market on time is critical to revenue growth. The competitiveness of our products depends on a number of factors including, performance, total cost of ownership, timely product introductions, product quality and reliability, product features and capabilities, energy efficiency (including power consumption and battery life, given their impact on total cost of ownership), size (or form factor), selling price, cost, adherence to industry standards (and the creation of open industry standards), level of integration, software and hardware compatibility, ease of use and functionality of software design tools, completeness of applicable software solutions, security and stability, brand recognition and availability. Competition is expected to remain intense, driven by rapid technological change, evolving standards, shifting customer preferences, product obsolescence, and frequent product launches from both established and new competitors.\n\n## Competition in Data Center Segment\n\nIn the Data Center segment, we compete primarily against Intel Corporation (Intel) and Nvidia Corporation (Nvidia with our CPU, GPU DPU and AI NIC server products. In addition, we compete against Altera with our FPGA and adaptive SoC server products. A variety of smaller fabless silicon companies offer proprietary accelerator solutions and Arm\u00ae-based CPUs targeting data center use cases. In addition, some of our customers are internally developing their own data center microprocessor products and accelerator products which could impact the available market for our products.\n\n## Competition in Client and Gaming Segment\n\nOur primary competitor in the supply of CPUs and APUs is Intel. A variety of companies provide or have developed Arm-based microprocessors and platforms which could lead to further adoption of Arm-based PC solutions.\n\nTable of Conten t s\n\nOur principal competitor in the supply of discrete graphics is Nvidia, who is the discrete GPU market share leader, and Intel, who manufactures and sells integrated graphics processors and gaming-focused discrete GPUs. With respect to integrated graphics, higher unit shipments of our APUs and Intel's integrated graphics may drive computer manufacturers to reduce the number of systems they build paired with discrete graphics components, particularly for notebooks, because they may offer satisfactory graphics performance for most mainstream PC users at a lower cost. We are the market share leader in semi-custom game console products, where graphics performance is critical.\n\n## Competition in Embedded Segment\n\nWe expect continued competition from our primary FPGA competitors such as Altera, Lattice Semiconductor Corporation and Microsemi Corporation, and from ASSP vendors such as Broadcom Corporation, Marvell Technology Group, Ltd., Analog Devices, Texas Instruments Incorporated, NXP Semiconductors N.V., Qualcomm Incorporated and NVIDIA. In addition, we expect continued competition from the ASIC market, which has been ongoing since the inception of FPGAs. Intel is our main competitor for embedded CPUs. Other competitors include manufacturers of high-density programmable logic products characterized by FPGA-type architectures; high-volume and low-cost FPGAs as programmable replacements for ASICs and ASSPs; ASICs and ASSPs with incremental amounts of embedded programmable logic; high-speed, low-density CPLDs; high-performance DSP devices; products with embedded processors; products with embedded multi-gigabit transceivers; discrete general-purpose GPUs targeting data center and automotive applications; and other new or emerging programmable logic products .\n\n## Research and Development\n\nWe focus our research and development (R&D) activities on designing and developing products. Our main area of focus is on delivering the next generation of processors (CPU and GPU), FPGAs and adaptive SoCs, accelerators (adaptive, graphics and DPU), SOMs and AI NICs, and the associated software for these products. We focus on designing, with security in mind, new integrated circuits (ICs) with improved performance and performance-per-watt in advanced semiconductor manufacturing processes, the design of logic and interface IP, advanced packaging technologies, and heterogeneous integration technologies. We also focus on software as part of the development of our products, including design automation tools for hardware, embedded software, AI stack, and optimized software tools and libraries that extend the reach of our platforms to software and AI developers. Through our R&D efforts, we were able to introduce a number of new products and enhance our IP core offerings and software.\n\nWe also work with industry leaders on process technology, design tools, intellectual property, software and other industry consortia to conduct early-stage R&D. We are also actively contributing to numerous industry open-source software initiatives and industry consortia across a broad range of technologies. We conduct product and system R&D activities for our products in the United States with additional design and development engineering teams located in various countries who undertake specific activities at the direction of our U.S. headquarters.\n\n## Third-Party Wafer Foundry Facilities\n\nWe utilize Taiwan Semiconductor Manufacturing Company Limited (TSMC) for the production of wafers for our HPC, FPGA and adaptive SoC products and GLOBALFOUNDRIES Inc. (GF), with respect to wafer purchases for our HPC products at the 12 nm and 14 nm technology nodes. Additionally, we utilize TSMC, United Microelectronics Corporation (UMC) and Samsung Electronics Co., Ltd. for the production of our ICs in the form of programmable logic devices.\n\n## Other Third-Party Manufacturers\n\nWe outsource board-level graphics product manufacturing to third-party manufacturers.\n\n## Assembly, Test, Mark and Packaging Facilities\n\nWafers for our products are either sorted by the foundry or delivered by the foundry to our assembly, test, mark and packaging (ATMP) partners or subcontractors located in the Asia-Pacific region, who package and test our final semiconductor products. We are party to two ATMP joint ventures (collectively, the ATMP JVs) with Tongfu Microelectronics Co., Ltd. The ATMP JVs, Siliconware Precision Industries Ltd. (SPIL) and King Yuan Electronics Company (KYEC) provide ATMP services for our products.\n\nTable of Conten t s\n\n## Intellectual Property and Licensing\n\nWe rely on contracts and intellectual property rights to protect our products and technologies from unauthorized third-party copying and use. Intellectual property rights include copyrights, patents, patent applications, trademarks, trade secrets and mask work rights. As of December 27, 2025, we had approximately 7,200 patents in the United States and approximately 2,200 patent applications pending in the United States. In certain cases, we have filed corresponding applications in foreign jurisdictions. Including United States and foreign matters, we have approximately 18,900 patent matters worldwide consisting of approximately 12,600 issued patents and 6,300 patent applications pending. We expect to file future patent applications in both the United States and abroad on significant inventions, as we deem appropriate. We do not believe that any individual patent, or the expiration of any patent, is or would be material to our business. As is typical in the semiconductor industry, we have numerous cross-licensing and technology exchange agreements with other companies under which we both transfer and receive intellectual property and technology rights. We have acquired various licenses from external parties to certain technologies that are implemented in our products, including our IP cores and devices. These licenses support our continuing ability to make and sell our products. We have also acquired licenses to certain proprietary software, open-source software, and related technologies, such as compilers, for our design tools. Continued use of such software and technology is important to the operation of the design tools upon which our customers depend .\n\n## Backlog\n\nSales are made primarily pursuant to purchase orders for current delivery or agreements covering purchases over a period of time. Although such orders or agreements may provide visibility into future quarters, they may not necessarily be indicative of actual sales for any succeeding period as some of these orders or agreements may be revised or canceled without penalty.\n\n## Seasonality\n\nOur operating results tend to vary seasonally. Historically, our net revenue has been generally higher in the second half of the year than in the first half of the year, although market conditions and product transitions could impact these trends.\n\n## Human Capital\n\nAs of December 27, 2025, we had approximately 31,000 employees in our global workforce. We believe we are at our best when our culture of innovation and people from all kinds of backgrounds work together in an engaging and open environment. Areas of focus for us include:\n\n## Mission, Culture, and Engagement\n\nFounded in 1969 as a Silicon Valley start-up, the AMD journey began with dozens of employees focused on leading-edge semiconductor products. From those modest beginnings, we have grown into a global company achieving many important industry firsts along the way. Today, we develop AI and high-performance computing to solve some of the world's toughest challenges.\n\nOur Vision - High performance and adaptive computing is transforming our lives.\n\nOur Mission - Build great products that accelerate next-generation computing experiences.\n\nOur employees are driven by this vision and mission. Innovation occurs when creative minds and diverse perspectives work together. This is the foundation of our unique culture and the reason we believe our employees are among the most engaged in our industry.\n\nWe conduct an annual survey of our global workforce to measure our culture, engagement, and workplace experience. The results are reviewed by our Board of Directors and acted upon by our senior leadership team. Results from our 2025 survey reported scores that continued to be among the very best for global companies in the technology industry.\n\n## Diversity, Belonging and Inclusion (DB&I)\n\nOur diverse workforce allows us to create an inclusive workplace that encourages employees to share their opinions and different perspectives. We believe that having a diverse talent pipeline, encouraging a culture of respect and belonging, and enabling unique voices to be heard fosters innovation and makes our company stronger. Our\n\nTable of Conten t s\n\nEmployee Resource Groups (ERGs) encourage employee engagement and play an important role in our culture. ERGs are voluntary initiatives in which an employee chooses to actively participate in one or more employee engagement programs. In 2025, we broadened our commitment to developing our engineering talent by expanding mentoring opportunities and career development programs for engineering professionals at AMD.\n\n## Total Rewards\n\nWe invest in our workforce by offering competitive salaries, incentives, and benefits to ensure that we continue to attract and retain the industry's best and brightest in an equitable manner. We regularly review our compensation practices, considering factors relevant to ensuring equitable pay such as an employee's role, experience, skills, and performance. We also benchmark set pay ranges based on relevant market data and our overall workforce. We focus on flexibility and choice in our benefits that resonate with a multi-generational workforce as well as offering inclusive benefits. We also provide flexibility with in-person, hybrid and remote work as options for our employees.\n\nWe have a strong pay for performance culture that we believe drives superior results and our rewards programs enable us to attract, retain and motivate our workforce.\n\n## Development\n\nWe offer our employees opportunities to advance their careers at the Company and the majority of our new leaders are promoted from within. We are focused on leadership progression and encourage our employees to take advantage of new opportunities. Our manager and leadership development programs are highly rated, and we provide specialized development programs for our employees as well as educational assistance in the form of tuition reimbursement for eligible employees to continue their university education or achieve advanced certifications.\n\nWe have an enterprise-wide mentoring program where employees have the opportunity to learn from experienced colleagues, develop new skills, and build their professional networks. The program also supports effective onboarding, helping new hires more quickly acclimate to our company culture and work processes.\n\n## Employee Voice\n\nAt AMD, we value the importance of employee voice and actively engage in efforts to ensure that our employees' opinions and perspectives are heard and considered. Our employee voice strategy includes an annual AMDer Survey (engagement survey) referenced above. Additionally, we measure effectiveness across all elements of the employee lifecycle, including onboarding, exit, and regularly seek out employee feedback on areas including benefits and total rewards satisfaction. Further, our executive team holds frequent employee roundtables, town halls and global team meetings, which facilitate open communication and feedback from our workforce.\n\n## Government Regulations\n\nOur global operations are subject to various United States and foreign laws and regulations, including, but not limited to, those relating to export control, customs, intellectual property, data privacy and security, climate, environmental, health and safety requirements, cybersecurity, tax, employment, competition and anti-trust, anti-corruption, anti-bribery, conflict minerals, corporate governance, financial and other disclosures, and AI. Compliance with these governmental laws and regulations do not presently have a material adverse impact on our capital expenditures, results of operations or competitive position. However, compliance with changes to existing or new regulations may have a material adverse impact on our future capital expenditures, results of operations or competitive position. In addition, the failure to comply with government laws and regulations may subject us to consequences including fines, limits on our ability to sell our products, suspension of certain of our business activities, reputational damage, criminal and civil liabilities, and sanctions, which may have a material adverse effect on our capital expenditures, results of operations or competitive position. For additional information about government regulations applicable to our business, and their potential impacts see Risk Factors in Item 1A.\n\n## Environmental Regulations\n\nOur operations and properties are subject to various United States and foreign laws and regulations, including those relating to materials used in our products and the manufacturing processes of our products, discharge of pollutants into the environment, the treatment, transport, storage and disposal of solid and hazardous wastes and remediation of contamination. These laws and regulations require our suppliers to obtain permits for operations in making our products, including the discharge of air pollutants and wastewater. Environmental laws are complex, change frequently and tend to become more stringent over time.\n\nTable of Conten t s\n\nCertain environmental laws, including the United States Comprehensive, Environmental Response, Compensation and Liability Act of 1980, or the Superfund Act, impose strict and, under certain circumstances, joint and several liability on current and previous owners or operators of real property for the cost of removal or remediation of hazardous substances and impose liability for damages to natural resources. These laws often impose liability even if the owner or operator did not know of, or was not responsible for, the release of such hazardous substances. These environmental laws also assess liability on persons who arrange for hazardous substances to be sent to disposal or treatment facilities when such facilities are found to be contaminated. Such persons can be responsible for cleanup costs even if they never owned or operated the contaminated facility. We have been named as a responsible party at three Superfund Sites in Sunnyvale, California that are on the National Priorities List. Since 1981, we have discovered hazardous material releases to the soil and groundwater from former underground tanks and proceeded to investigate and conduct remediation at these three sites. The chemicals released into the groundwater were commonly used in the semiconductor industry in the United States in the wafer fabrication process.\n\nIn 1991, we received Final Site Clean-up Requirements Orders from the California Regional Water Quality Control Board relating to the three sites. We entered into an agreement with another responsible party with respect to one of the sites. Pursuant to that agreement, the other party is responsible for cleanup of certain offsite contamination. We remain responsible for cleanup not covered by the agreement, including on-site cleanup, as well as all remaining costs in the event that the other party does not fulfill its obligations under the agreement.\n\nTo address anticipated future remediation costs under the orders, we have computed and recorded an estimated environmental liability of approximately $5.9 million and have not recorded any potential insurance recoveries in determining the estimated costs of the cleanup. The progress of future remediation efforts cannot be predicted with certainty and these costs may change. We believe that any amount in addition to what has already been accrued would not be material.\n\nAdditional environmental regulations on materials, chemicals, energy and waste apply directly or indirectly to the design, manufacturing, use and end-of-use of semiconductor devices and solutions. As examples, the European Union (EU) and China are among a growing number of jurisdictions that have enacted restrictions on the use of lead and other materials in electronic products. Chemical reporting and restriction requirements continue to evolve, namely related to per- and polyfluoroalkyl substances (PFAS). Jurisdictions including the EU, California and China are developing or have finalized product energy efficiency regulations impacting market access and/or public procurement for computers and servers. Existing and developing regulations related to electronic waste recycling and extended producer responsibility, including the EU, China, Brazil, India, as well as state and municipal jurisdictions like California and Sao Paulo Brazil, require labeling, fees and/or reporting to support recycling efforts. Certain of these laws target end-user products. However, the scope of such laws is inconsistent, which increases the complexity of compliance. We continue to work with customers, suppliers and industry groups to monitor and address product-related environmental regulations. While compliance has not historically had a material impact on our financial condition, earnings, or competitive position, there can be no assurance that these evolving laws will not require us to incur significant costs, modify our operations or product designs, or take other actions for compliance.\n\n## Additional Information\n\nAMD was incorporated under the laws of Delaware on May 1, 1969 and became a publicly held company in 1972. Our common stock is currently listed on The NASDAQ Global Select Market (NASDAQ) under the symbol \"AMD\". Our mailing address and executive offices are located at 2485 Augustine Drive, Santa Clara, California 95054, and our telephone number is (408) 749-4000. For financial information about geographic areas and for segment information with respect to revenues and operating results, refer to the information set forth in Note 4 of our consolidated financial statements. We use a 52- or 53-week fiscal year ending on the last Saturday in December. References in this report to 2025, 2024 and 2023 refer to the fiscal year unless explicitly stated otherwise.\n\nAMD, the AMD Arrow logo, 3D V-Cache, Alveo, Athlon, Atrix, CDNA, CoolRunner, EPYC, FidelityFX, FirePro, FreeSync, Geode, Infinity Fabric, AMD Instinct, Kintex, Kria, Opteron, Pensando, Radeon, RDNA, ROCm, Ryzen, Spartan, Threadripper, UltraScale, UltraScale+, Versal, Virtex, Vitis, Vivado, XDNA, Xilinx, Zynq and combinations thereof are trademarks of Advanced Micro Devices, Inc.\n\nMicrosoft, Windows, and Xbox One are registered trademarks of Microsoft Corporation in the United States and/or other countries. Linux is the registered trademark of Linus Torvalds in the United States and/or other countries. PlayStation is a registered trademark of Sony Interactive Entertainment, Inc. Arm is a registered trademark of Arm Limited (or its subsidiaries) in the United States and/or other countries.\n\nTable of Conten t s\n\nOther names are for informational purposes only and are used to identify companies and products and may be trademarks of their respective owners.\n\n## Website Access to Our SEC Filings and Corporate Governance Documents\n\nOn the Investor Relations pages of our website, http://ir.amd.com, we post links to our filings with the SEC, our Principles of Corporate Governance, our Code of Ethics for our executive officers, all other senior finance executives and certain representatives from legal and internal audit, including our Chief Executive Officer, Chief Financial Officer, Chief Accounting Officer and persons performing similar functions, our Global Code of Conduct, which applies to our Board of Directors and all of our employees, and the charters of the committees of our Board of Directors.\n\nOur filings with the SEC are posted on our website as soon as reasonably practical after they are electronically filed with, or furnished to, the SEC. The SEC website, www.sec.gov, contains reports, proxy and information statements, and other information regarding issuers that file electronically with the SEC. You can also obtain copies of these documents by writing to us at: Corporate Secretary, AMD, 2485 Augustine Drive, Santa Clara, California 95054, or emailing us at: Corporate.Secretary@amd.com. All of these documents and filings are available free of charge.\n\nIf we make substantive amendments to our Code of Ethics or grant any waiver, including any implicit waiver, to our principal executive officer, principal financial officer, principal accounting officer, controller or persons performing similar functions, we intend to disclose the nature of such amendment or waiver on our website.\n\nThe information contained on our website is not incorporated by reference in, or considered to be a part of, this report.\n\nTable of Conten t s\n<\/document>\n\n<document company=\"INTC\" fiscal_year=\"2025\" fiscal_year_end=\"2025-12-27\" form=\"10-K\" section=\"Item 1 - Business\">\n## Business\n\nWe are a global designer and manufacturer of semiconductor products. The CPUs and other semiconductor solutions that we design, manufacture, market, sell and service are incorporated in computing and related end products and services, and utilized globally by consumers, enterprises, governments and educational organizations. Our customers primarily include OEMs, ODMs, CSPs, and other manufacturers and service providers, such as industrial and communication equipment manufacturers. We market and sell our products through a combination of direct sales through our global sales organization and indirect channels, including distributors, resellers, retailers and OEM partners.\n\nAs a U.S.-based integrated design manufacturer, or IDM, in addition to designing CPUs and other semiconductor products, we develop leading-edge semiconductor manufacturing process technologies, or nodes, and advanced packaging technologies and predominantly manufacture our semiconductor products at our manufacturing and assembly and test facilities, many of which are in the U.S. We are the only company undertaking research, design and development of leading-edge and next generation semiconductor manufacturing technologies and high-volume manufacturing of logic semiconductors utilizing leading-edge nodes in the U.S., making us a strategically important company from both a national economic and national security perspective. In addition to manufacturing our own products, we offer third-party foundry services to external customers and aim to establish this business as a leading external foundry.\n\n## Our Strategy\n\nFor more than 50 years, we have contributed to the advancement of computing technology that powers the digital world. Building on our legacy of innovation, we are focused on transforming our business to meet the demands of a rapidly evolving technology landscape. The pace of technological change, dynamic customer needs and intensifying competition continue to shape the semiconductor industry. A secure, resilient and balanced semiconductor supply chain has become increasingly important to maintaining continuity of operations for global enterprises, governments and consumers, while meeting global demand in an uncertain and rapidly changing world.\n\nWe aim to build a new Intel for the future, undertaking an enterprise-wide transformation to strengthen execution, enhance innovation and better position our products and offerings in the complex, highly competitive and rapidly evolving technology landscape. In 2025 and recent years, the semiconductor industry has experienced momentum driven by the following:\n\n\u25aa significantly increased compute demand, particularly for GPU systems, driven by generative AI workloads;\n\n\u25aa an expansion in the types of AI workloads as AI technologies are adopted across industries and applications;\n\n\u25aa a PC market driven by user refreshes that resulted from expanding AI capabilities, end-of-support for Windows 10 and aging devices from the COVID era; and\n\n\u25aa increased demand for secure and geographically diversified supply chains in a period of increased geopolitical tensions.\n\nWe expect these trends to continue in 2026 and future years, with continuing rapid adoption of AI technologies across an increasing number of industries and applications driving demand across a full spectrum of AI workloads, including generative AI, AI inference, agentic AI and physical AI, from traditional and AI data centers to network and enterprise environments and client and edge. We believe AI represents a generational shift in computing requiring a range of compute silicon, including GPUs, ASICs, CPUs and xPUs. Our multi-year strategy is designed to enable us to participate in the expanding market and increase in compute demand through our products and our foundry capabilities, including wafer manufacturing and advanced packaging. Our strategy is centered on four core priorities:\n\n\u25aa Transforming our culture t o become an engineering-focused, customer-centric organization that prioritizes decisive actions, disciplined execution and strong financial management;\n\n\u25aa Revitalizing the x86 ecosystem that for decades has been our foundation of leadership, adapting and advancing our x86 product offerings to support current and next-generation AI workloads, supported by our U.S.-based leading-edge semiconductor process technology R&D and manufacturing and advanced packaging capabilities;\n\n\u25aa Growing our external foundry business where we aim to leverage our U.S.-based capabilities in leading-edge semiconductor process technology R&D and manufacturing and advanced packaging to become a trusted foundry partner to third-party semiconductor customers and to financially support our continued investment in capital-intensive, U.S.-based, leading-edge R&D and manufacturing; and\n\n\u25aa Expanding our market opportunities by leveraging our engineering and design expertise to develop purpose-built ASICs and GPUs for customers to address the increasing diversity of AI-driven compute workloads.\n\nOur Priorities\n\n## Transforming Our Culture\n\nWe are undertaking an enterprise-wide cultural transformation aimed at reestablishing engineering excellence, developing a customer-centric mindset, prioritizing decisive action and disciplined execution and restoring strong financial management. In 2025, we simplified our organizational structure, reduced management layers and empowered technical teams to accelerate decision-making and innovation. These changes are intended to increase transparency and accountability, improve operational efficiency, reduce barriers to collaboration and product development and lower expenses.\n\nWe also implemented a disciplined financial approach to support our strategic priorities. We are better aligning capital investments with business objectives and customer demand signals, and we continued to monetize non-core assets. These actions are designed to shift us toward a more agile and focused operating model, improve resource allocation and support long-term value creation for customers, partners and stockholders. While our cultural transformation is ongoing, we believe these changes represent foundational steps to position us for sustained performance and competitiveness.\n\n## Revitalizing the x86 Ecosystem\n\nOur x86 architecture and related CPU offerings have served as a foundational computing platform for over four decades, supporting a broad range of client and data center applications and enabling a heterogeneous environment from which a deep and extensive software ecosystem has developed. The widespread adoption of our x86 architecture and related CPU offerings and established software ecosystem continues to provide interoperability and performance across diverse workloads. We remain focused on adapting and advancing our x86 product portfolio to meet evolving market needs, including those driven by inference AI, agentic AI and physical AI. In 2025, we introduced new x86 solutions tailored to client and data center platforms, including our next generation client CPU code named Panther Lake, which is designed to combine improved power efficiency and performance to support next-generation AI-enabled workloads at the edge. We also announced a strategic partnership with NVIDIA to co-develop custom client and data center products combining our x86 CPU technologies with NVIDIA's AI and accelerated computing capabilities. The collaboration is intended to jointly develop multiple generations of products for hyperscale, enterprise and consumer markets based on the x86 architecture.\n\nWe pair our x86 CPUs with GPUs, IPUs, NPUs and other accelerators designed to optimize performance across a range of workloads. This heterogeneous approach enables us to deliver compute platforms that match the specific requirements of inference, training and orchestration tasks. In our Client Computing Group (CCG) business, we are enabling AI capabilities across PCs, workstations and edge devices, supported by deep ecosystem partnerships. In our Data Center and AI (DCAI) business, our full-stack AI strategy integrates x86 CPUs with accelerators and custom silicon to support scalable, reliable and cost-efficient infrastructure.\n\nThe competitiveness of our product offerings depend on access to manufacturing capacity on leading-edge nodes and advanced packaging. Throughout the history of the company, we have invested significant capital resources to continually develop new generations of leading-edge nodes and build manufacturing capacity to produce semiconductor logic chips utilizing such nodes. Our relentless pursuit to improve the performance, power efficiency and cost-effectiveness of the semiconductor manufacturing process has enabled us to reduce the cost of a semiconductor logic chip by shrinking its size or increasing its functionality and performance while maintaining cost competitiveness through higher transistor density. Our continued pursuit of such improvements is essential to our ability to continue to manufacture products that meet evolving customer requirements across computing segments, and we have made substantial progress in the last few years towards reestablishing the competitiveness of our manufacturing process technologies. In 2025, we released our initial Intel Core Ultra Series 3 processors, the first products to be manufactured using our new Intel 18A process technology. Intel 18A introduces two industry firsts in high-volume semiconductor manufacturing: gate-all-around transistors (RibbonFET) and backside power delivery (PowerVia). We expect Intel 18A to serve as the manufacturing process for multiple generations of our future client and server CPU products. We are also continuing development of Intel 14A, our next-generation node, which has been designed from inception as an offering to external customers. Intel 14A builds upon the architectural innovations of Intel 18A to deliver further improvements in performance per watt and density scaling.\n\nWe remain committed to advancing leading-edge semiconductor process technology and manufacturing in the U.S., where we are the only company conducting both leading-edge semiconductor logic R&D and related high-volume manufacturing. We intend to remain a leading developer of semiconductor process technology and a major manufacturer of semiconductors, and we plan to continue manufacturing the majority of our products in our own factories. This integrated approach helps enable us to optimize product performance, accelerate time-to-market and scale efficiently to meet customer demand. It also provides strategic control over manufacturing operations, supports differentiation in process technology capabilities and advanced packaging, provides increased supply resilience and reinforces our role as a U.S.-based provider of leading-edge semiconductor manufacturing. However, the development and manufacturing of modern leading-edge process technologies, particularly those utilizing EUV lithography such as Intel 4, Intel 3, Intel 18A, Intel 14A and future nodes, require substantial capital investment. These leading-edge process technologies are essential to deliver competitive products, but their cost structure requires manufacturing volumes beyond what we expect from our own products to achieve economic efficiency. In light of these considerations, in 2025, we streamlined our footprint to improve operational efficiency and better align capacity with anticipated demand. We initiated the consolidation of our Costa Rican assembly and test operations into our other facilities, which we expect to be completed by the end of 2026, slowed the pace of construction for our new Ohio wafer fabrication facility, or fab, and discontinued planned expansions in Germany (fab) and Poland (assembly and test facility). Further, we announced that if we are unable to secure a significant external foundry customer for Intel 14A, we may pause or discontinue our pursuit of Intel 14A and successor leading-edge process technologies. In such event, we would expect, over time, to shift manufacturing to third-party foundries, particularly TSMC, as we develop products for nodes beyond Intel 18A and its derivative node, Intel 18A-P.\n\n## Growing Our External Foundry Business\n\nIn recent years, the cost of developing leading-edge semiconductor process technologies and of the manufacturing facilities utilizing such process technologies has increased significantly and outpaced the growth in our products business. As a result, to improve the financial viability of our continued development of leading-edge semiconductor process technologies and the utilization of our manufacturing assets, a few years ago we started transitioning our semiconductor manufacturing business from one that has historically been designed to serve our internal product groups into a customer-centric foundry business designed to also serve third-party external semiconductor customers. Our foundry strategy was also designed to enable us to participate in the increasing demand for U.S.-based foundry capacity and a more secure, resilient and balanced semiconductor supply chain. Since that decision, demand for leading-edge foundry capacity has increased significantly to support the demand for compute, particularly from AI workloads, and we expect continued increases in such demand in future years. While we have few external customers to date, developing an external foundry business is a key long-term strategy for our business and one that we aim to have more success with as we move to more advanced nodes.\n\nAn external foundry business is built on the principle of trust. We recognize that delivering high-quality, reliable and high-yield manufacturing services is essential to earning and retaining external foundry customers. Our foundry offerings include four components: wafer fabrication, advanced packaging, chiplet integration and design enablement services. In 2025, we ramped Intel 18A into high-volume production and are seeking to establish it as our first significant node for government and enterprise foundry customers. We enhanced operational processes and quality systems to meet the rigorous standards expected in the foundry industry, and continued investing in ecosystem enablement to make our manufacturing network accessible to third-party external customers, including support for industry-standard EDA tools, process design kits and a broad portfolio of foundation IP that customers can utilize as a part of their designs. We are actively seeking customers for our future Intel 14A node, which is our first node designed from inception as an offering to external customers.\n\n## Expanding Our Market Opportunities\n\nWe aim to leverage our engineering and design expertise to develop purpose-built ASICs and GPUs for customers to address the expanding variety of AI-driven compute workloads. In 2025, we unified our horizontal engineering functions into a central engineering group to drive efficiencies across foundational IP development, test chip design, EDA tools and design platforms to help us deliver the combination of infrastructure and software needed for agentic AI workloads, which require integration across multiple models and compute types. With this new internal consolidation of capabilities, we also aim to develop an ASICs and design services business to deliver purpose-built silicon for a broad range of external customers. The goal is to both extend the reach of our core x86 IP and leverage our design strengths to deliver an array of solutions from general purpose to workload-optimized computing.\n\nInference AI, agentic AI and physical AI workloads are rapidly emerging areas that we expect may ultimately represent larger market opportunities than the generative AI workloads that have been the core area of AI technology growth over the last few years. We aim to partner with an array of incumbent and developing companies defining these emerging areas and position our x86 platform to be their platform of choice. We also aim to participate in these emerging areas through our continued development of our Xeon, AI PCs, Arc GPUs and our open software stack, as well as by developing successive generations of inference-optimized GPUs on a targeted annual cadence that feature enhanced memory and bandwidth to meet enterprise needs.\n\nFinally, our strategy includes combining our IP and SoC development capabilities with our leading-edge manufacturing know-how to provide differentiated and full-service semiconductor solutions.\n\n## Our Business\n\nWe are a global leader in the design and manufacturing of CPUs and other semiconductor products. Our products are designed and marketed by our Intel Products business, which includes our CCG and DCAI operating segments, and are manufactured by our Intel Foundry operating segment and third-party suppliers. Our Intel Foundry operating segment also offers semiconductor design and manufacturing services to external customers. We leverage our talent, IP, manufacturing assets and other resources to run our business and execute our strategic priorities.\n\nWe report our business results in three reportable segments: CCG, DCAI and Intel Foundry. In addition to these reportable segments, we present an \"all other\" category, which is not a reportable segment. On September 12, 2025, we completed the divestiture of 51% of Altera. As of that date, Altera's results of operations were no longer included in our consolidated or segment results. Altera's financial results were reported within our \"all other\" category for all periods presented through September 11, 2025. There are no changes to our Consolidated Financial Statements or segment results for any prior periods resulting from the Altera transaction, which is further described below.\n\n## Intel Products\n\nIntel Products consists substantially of the design, development, marketing, sale, support and servicing of CPUs and related products. Intel Products is composed of two operating segments: CCG and DCAI.\n\nCCG\n\n## Overview\n\nCCG delivers platforms and processors that power PCs and edge devices, enabling enhanced performance, connectivity and user experiences for consumer and commercial markets, with capabilities that also support retail, industrial robotics and AI ecosystems at the edge. Our direct customers include distributors and OEMs that design and sell PCs and related devices. Our platforms and processors are included in products sold to consumers and to commercial enterprises across industries such as education, healthcare, finance and government. We address demand for desktops, notebooks and emerging AI PCs, while expanding into edge computing markets through partnerships with solution providers and independent software vendors.\n\n## Market Trends\n\nThe PC market in 2025 was driven by a hardware refresh cycle, increased demand for and adoption of AI PCs and expanding PC adoption outside the U.S. End-of-support for Windows 10 and aging devices from the COVID era drove PC refresh activity, while the introduction of AI PC capabilities also contributed to higher demand. Individual users sought powerful, energy-efficient systems for productivity and entertainment, while enterprises modernized fleets to improve employee productivity and security. Additionally, educational institutions increased PC adoption, particularly in international markets. We believe AI integration will remain a key differentiator, and we are aiming to address these trends through our latest and future generations of Intel Core Ultra processors designed to enable advanced AI capabilities and high performance.\n\n## Competition\n\nCCG's primary competitor is AMD, which like us designs processors based on the x86 architecture. Client CPUs utilizing the x86 architecture remain the foundational computing platform for the majority of PCs, enabling a heterogeneous environment from which a deep and extensive software ecosystem has developed. We also face significant competition from companies that design processors based on the ARM architecture, such as Apple with its M series products, Qualcomm with its Snapdragon products and MediaTek with its Kompanio products. We operate in a highly competitive market and expect this environment to further intensify in 2026.\n\nDCAI\n\n## Overview\n\nDCAI delivers workload-optimized solutions based upon our x86 architecture for data centers, including CPUs, AI accelerators, NICs, IPUs, and custom ASICs, enabling performance and scalability for cloud, enterprise, telecommunication and HPC environments. Our direct customers include global CSP/hyperscalers and OEMs. Our OEM customers, in turn, sell to multinational corporations, small- and medium-sized enterprises, independent hardware and software vendors, systems integrators, communications service providers and government entities. Our DCAI offerings are designed to support key workloads such as AI, analytics and networking and edge computing through a combination of hardware and software offerings.\n\n## Market Trends\n\nThe data center market in 2025, consistent with the last few years, was driven by rapid growth in data generation and widespread adoption of AI across industries. AI workloads, spanning enterprise data centers to edge environments, have driven increased demand for power-efficient infrastructure and low-latency performance as automation continues to expand within business operations. Organizations sought scalable, secure and energy-efficient solutions to manage rising complexity and performance needs, prioritizing GPU systems offered by certain of our competitors to handle compute-heavy generative AI workloads, often at the expense of CPU investment. In addition, competition in the data center CPU market in which we compete remained intense. We believe system-level integration of hardware and software will continue to be essential, and we intend to address these trends through product development investments in heterogeneous compute, networking, memory technologies and open standards to enable capabilities such as AI to be deployed at scale.\n\n## Competition\n\nDCAI competitors include AMD, which utilizes the x86 architecture and competes with us across the full spectrum of CPUs, GPUs, accelerators and other products; providers of GPU systems such as NVIDIA, whose GPU systems have experienced the highest demand in the market as AI workloads have become the dominant source of compute demand; companies developing their own custom silicon, including many hyperscalers such as Amazon, Google, Meta and Microsoft; and both new entrants and incumbents developing ARM- and RISC-V-based products tailored to specific data center and AI workloads. We also compete with Broadcom in the cus
