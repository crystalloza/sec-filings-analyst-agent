tom ASICs development market. We expect this competitive landscape to continue to evolve and to become increasingly intense.\n\nIntel Foundry\n\n## Overview\n\nIntel Foundry, comprised of technology development, manufacturing and foundry services, develops new leading-edge semiconductor process technologies and advanced packaging technologies and provides manufacturing, assembly and test and advanced packaging capacity and design enablement solutions across multiple nodes and platforms. We continue to innovate and advance leading-edge semiconductor process technology and manufacturing in the U.S., where we are the only company conducting both leading-edge logic R&D and high-volume manufacturing. We believe our foundry offerings benefit from our systems-of-chips capabilities, U.S.-based manufacturing leadership and global operational scale, supported by a robust design ecosystem. At present, nearly all of our Intel Foundry business supports internal manufacturing for Intel Products; however, we are offering our Intel Foundry services to external customers and aim to develop a more significant external foundry business in the future.\n\n## Market Trends\n\nIn 2025, the semiconductor foundry market was shaped by rapid growth in AI and high-performance computing workloads. These applications drove demand for higher computational performance and greater power efficiency, accelerating a shift in semiconductor designs from traditional monolithic chips to disaggregated architectures built on interconnected chiplets optimized for specific workloads and integrated through advanced packaging technologies to support increasingly complex systems. At the same time, customers and manufacturers are reconfiguring supply chains to enhance resiliency.\n\nThe capital intensity of leading-edge semiconductor manufacturing has increased significantly in recent years, particularly with advanced nodes utilizing EUV lithography, limiting competition to only a few manufacturers with sufficient scale. Historically, improvements in performance, power efficiency and cost-effectiveness were achieved primarily through transistor scaling to increase density. While scaling continues at advanced nodes, manufacturers now complement it with innovations such as advanced packaging, chiplet architectures and new transistor designs to deliver additional performance and efficiency gains. We believe we are one of three companies (the others being TSMC and Samsung) investing in 2nm lithography and next-generation transistor architectures to deliver continued improvements in performance and efficiency for semiconductor logic chips. Leading-edge foundries seek to amortize these investments over extended periods, initially seeking to maximize volume and pricing on leading-edge designs that benefit from the most performant transistors and later prioritizing ease of design and cost optimization as technologies mature. We intend to address these trends through continued investment in our leading-edge process technologies, packaging innovation and ecosystem partnerships to enable next-generation compute solutions.\n\n## Competition\n\nIntel Foundry competitors include semiconductor foundries that deliver wafers and packaging technologies from fabrication plants located primarily in Asia. Our primary competitor in leading-edge semiconductor process technology is TSMC, which holds a leading position in manufacturing at scale for the most advanced nodes. We also compete directly with Samsung in this market. Other Intel Foundry competitors include GlobalFoundries, UMC and SMIC, which primarily focus on mature process technologies.\n\n## All Other\n\nOur \"all other\" category includes the results of operations from non-reportable segments, start-up businesses that support our initiatives, and historical results of operations from divested businesses. A summary of the largest businesses within this category for 2025, 2024 and 2023 includes:\n\n\u25aa Mobileye, a publicly-traded company and a global leader in driving assistance and self-driving solutions with a product portfolio designed to encompass the entire stack required for assisted and autonomous driving, including compute platforms, computer vision and machine learning-based perception, mapping and localization, driving policy and active sensors in development. As of December 27, 2025, we continued to consolidate Mobileye and held equity interests representing an 80% ownership interest in Mobileye;\n\n\u25aa IMS, which specializes in developing and manufacturing multi-beam mask writing tools. As of December 27, 2025, we continued to consolidate IMS and held equity interests representing a 68% ownership interest in IMS; and\n\n\u25aa Altera, which was previously a wholly-owned subsidiary, was deconsolidated from our Consolidated Financial Statements effective September 12, 2025 following the closing of our sale of 51 % of Altera's issued and outstanding common stock. Altera's financial results of operations were included in our \"all other\" category through September 11, 2025. As of and after September 12, 2025, our retained non-marketable equity interest in Altera is accounted for as an equity method investment. See \"Note 10: Acquisitions and Divestitures\" within Notes to Consolidated Financial Statements for further information.\n\n## Products\n\nOur CPUs and other semiconductor offerings utilize our x86 architecture and are designed, marketed, sold and supported by our CCG and DCAI operating segments. Our products are incorporated into various computing form factors and address a variety of computing workloads, scaling from PC to data center, network, edge computing and AI applications.\n\nWe are intensely focused on maintaining and enhancing the competitiveness of our products, which is key to the long-term success of our business. Our objective with each new generation of products is to deliver improved user experiences and value through advances in performance, power efficiency, cost, connectivity, security, form factor and other features. We also endeavor to reduce design complexity, reuse IP and increase ecosystem collaboration to improve efficiency and accelerate innovation.\n\nx86 Architecture and Ecosystem\n\nOur x86 architecture remains foundational to our CCG and DCAI product portfolios, and we continue to enhance it to deliver performance, energy efficiency, compatibility and scalability across our client and data center offerings including those for PCs, edge devices, data centers and AI workloads. Developers and others have utilized our x86 architecture for decades to build and optimize a vast ecosystem of compatible software, tools and related applications that are used by consumers, enterprises, governments and educational institutions globally. Investments in x86 innovation, such as advanced microarchitectures, power optimizations and security features, help maintain x86 CPUs as a core component of heterogeneous computing environments and provide a strong base for emerging workloads, including AI-driven applications.\n\nxPU and AI Accelerators\n\nWe believe the future of computing lies in complex systems utilizing a diverse mix of scalar, vector, matrix and spatial architectures deployed in CPUs, GPUs, NPUs, IPUs and accelerators, which we refer to generally as xPUs, supported by a scalable software stack and integrated through advanced packaging technologies. This approach is designed to address AI, analytics and high-performance workloads. In support of this approach, we are developing processors that incorporate multiple computing architectures, moving toward heterogeneous computing where x86 CPUs operate alongside specialized AI engines to support performance for inference, training and emerging agentic AI models.\n\n## Key Products\n\nWe derived most of our consolidated revenue in 2025, 2024 and 2023 from our CCG and DCAI product offerings.\n\nCCG\n\nThe key product offerings of our CCG operating segment are as follows:\n\n\u25aa Client CPUs. Our client CPUs are offered in a broad range of configurations to appeal to different consumer applications and price points. They are generally offered to customers in the form of a system-on-chip, or SoC, with the primary CPU compute chip combined with a controller and memory hub and GPU, NPU, IPU or other accelerator chips enabling additional capabilities. They are currently grouped broadly into two product families:\n\n\u25aa Intel Core. Our Intel Core brands have been staples of the PC industry for nearly two decades. These products are designed to serve a broad cross-section of the customer and computing needs in the client market, including laptops, desktops and edge devices, at entry-level to mid-level price points. These products are manufactured on our Intel 7 process technology and represented almost half of our CCG product sales by revenue in 2025, with their percentage contribution expected to decrease significantly in 2026 as sales of Intel Core Ultra processors increase.\n\n\u25aa Intel Core Ultra. Our Intel Core Ultra family is designed for higher performance to serve a wide variety of both PC and edge applications across consumer and commercial segments at higher-level price points.\n\n\u25aa Series 1. The Intel Core Ultra Series 1 products, manufactured using our Intel 4 process, introduced the first AI PCs to the market in 2023.\n\n\u25aa Series 2. Our first Intel Core Ultra Series 2 products, the 200V Series, were brought to market in 2024. The Intel Core Ultra 200V Series leverages our X e 2 GPU architecture, bringing improved efficiency, second-generation ray tracing units and XMX AI acceleration to the premium market for thin and light notebooks. In 2025, we introduced a desktop version of the Intel Core Ultra Series 2 for a wide variety of applications, from gaming to enterprise. Intel Core Ultra Series 2 features the first implementation of an NPU and Foveros advanced packaging technologies in desktop microprocessors. Manufacturing of our Intel Core Ultra Series 2 products is performed by Intel Foundry using our Intel 3 process technology or by an external foundry, depending on the version.\n\n\u25aa Series 3. We released our initial Intel Core Ultra Series 3 processors, the first products to be manufactured using our new Intel 18A process technology, in late 2025. These new mobile processors offer further improved CPU, AI and graphics performance while maintaining power efficiency.\n\n\u25aa Commercial CPUs. We offer chipsets and versions of our client CPUs, including our Intel vPro \u00ae Platform, to commercial customers with additional hardware features enabled, enhanced firmware controls and an enterprise-grade software stack. In 2025, we introduced Intel vPro Fleet Services, a new remote manageability capability that provides increased resilience and automation, helping minimize downtime and enhance proactive control over PC fleets. In the commercial area, we are working with partners to enable new AI software capabilities on PCs in the enterprise environment.\n\n\u25aa Discrete Client GPUs. Our Intel \u00ae ArcTM graphics family is primarily designed for consumer and gaming PCs, offering modern GPU features to power immersive games, creator applications and AI workloads. In 2024, we launched the Intel Arc B-Series based on the latest X e 2 GPU architecture, delivering significantly improved performance and power efficiency over our Intel Arc A-Series.\n\n\u25aa Edge Computing. We offer versions of our client CPUs, including both Intel Core and Intel Core Ultra processors, to customers for various edge computing applications across a range of industries, including manufacturing, healthcare, retail and education. In 2025, we introduced an open software platform, Open Edge, designed to make it easier for businesses to run AI and other applications at the edge and accelerate AI deployments within the x86 edge ecosystem.\n\n\u25aa Connectivity. We offer wireless (Wi-Fi, Bluetooth) and wired (Thunderbolt, Ethernet) products for PCs and edge systems. In 2025, we launched our third-generation Wi-Fi 7 and Bluetooth 6 solutions and updated our Thunderbolt 5 solution for our latest platforms and accessories.\n\nOur software portfolio supports the functionality and optimization of our hardware platforms across workloads and architectures. We provide support for AI frameworks such as PyTorch, TensorFlow, Hugging Face, vLLM, and WebNN for execution on CPUs, GPUs and accelerators.\n\nDCAI\n\nThe key product offerings of our DCAI operating segment are as follows:\n\n\u25aa Server CPUs. Intel's data center business is anchored by the Intel \u00ae Xeon \u00ae series of processors, a family of x86-based server and network CPUs that for decades have provided foundational compute for data center, cloud, networking and intelligent edge deployments. The Intel Xeon installed base represents a significant portion of global server infrastructure, and this scale, combined with our broader portfolio of accelerators, networking solutions and software, positions Intel Xeon processors as a central category to enable AI and other data-intensive workloads from cloud to edge. In 2025, sales were distributed across four generations of Intel Xeon processors:\n\n\u25aa Intel Xeon Scalable Processors. 3rd, 4th and 5th Gen Intel Xeon Scalable processors are manufactured using our Intel 7 process technology, represented a majority of DCAI product sales by revenue in 2025 and are expected to be a somewhat smaller majority of our DCAI product sales by revenue in 2026.\n\n\u25aa 3rd Gen. The 3rd Gen Intel Xeon Scalable processors, introduced in 2021, incorporate enhanced security features such as Intel \u00ae Software Guard Extensions (SGX) for confidential computing and Intel \u00ae Crypto Acceleration for faster encryption.\n\n\u25aa 4th Gen . The 4th Gen Intel Xeon Scalable processors, introduced in early 2023, incorporate a multi-die design connected using Embedded Multi-die Interconnect Bridge (EMIB) technology. These processors include numerous integrated workload-specific accelerators, including Intel \u00ae Advanced Matrix Extensions (Intel \u00ae AMX), significantly boosting performance for AI versus the prior generation. Compute Express Link (CXL), an open, industry-standard interconnect designed to extend memory and enable cache-coherent communication, was introduced with this generation along with DDR5 memory and PCIe Gen 5 for higher memory and I/O bandwidth.\n\n\u25aa 5th Gen . The 5th Gen Intel Xeon Scalable processors, introduced in late 2023, utilize the same platform as the 4th Gen processors but provide improved overall performance and performance per watt with faster DDR5 memory, larger last-level cache, and faster chip-to-chip communication. This generation further extended the confidential computing capabilities versus prior generations with Intel \u00ae Trust Domain Extensions (Intel \u00ae TDX) support for hardware-isolated virtual machines.\n\n\u25aa Intel Xeon 6. Introduced in 2024 with higher core counts, these latest generation processors are designed to excel in both performance and efficiency to meet the evolving demands of modern data centers. In 2025, we expanded the family with additional processors and platforms optimized for AI, networking and general-purpose data center workloads, broadening performance, efficiency and deployment options across enterprise, telecommunications and cloud use cases. The Intel Xeon 6 family features two distinct microarchitectures:\n\n\u25aa Performance-cores (P-cores) for compute-intensive, workloads such as AI and HPC; and\n\n\u25aa Efficient-cores (E-cores) for high-density compute and scale-out workloads such as microservices and cloud-native applications.\n\nWith an innovative modular x86 architecture, the compute die for Intel Xeon 6 series processors are manufactured using our Intel 3 process technology while the I/O dies are manufactured on our Intel 7 process technology and connected in a single package utilizing EMIB technology. Intel Xeon 6 improves memory throughput with the fastest DDR5 memory available, including Multiplexed Rank DIMM (MRDIMM) support. To address key market requirements for AI compute and data protection, Intel Xeon 6 processors incorporate differentiated features such as Intel AMX for AI, Intel \u00ae QuickAssist Technology (Intel \u00ae QAT) for cryptography and compression offload, and Intel TDX for hardware-based security. Intel Xeon 6 is available in multiple series (6300, 6500, 6700, 6900) supporting a range of workloads designed to enable data center architects to optimize infrastructure for private, public and hybrid clouds.\n\n\u25aa Discrete GPUs: In 2025, as part of our revised AI strategy to develop successive generations of inference-optimized GPUs on a targeted annual cadence featuring enhanced bandwidth and memory to meet enterprise needs, we announced our development of Crescent Island, our first GPU to be built on the advanced Xe3P architecture. Crescent Island is being engineered specifically for data center environments, with a strong emphasis on low power consumption, high throughput and optimized performance for AI inference workloads. Our aim is for it to be a significant step forward in delivering efficient, scalable AI solutions for modern data center needs.\n\nWe are also continuing to develop our next-generation GPU architecture, Jaguar Shores, which is designed to further enhance AI workload capabilities. With Jaguar Shores, we will aim to provide customers with greater flexibility and scalability for demanding AI applications.\n\n\u25aa Networking: Our core networking portfolio centers on Ethernet controllers and network adapters that deliver connectivity for servers, storage, network appliances in cloud, enterprise IT and telecom data centers. An Ethernet controller's primary function is to manage network connectivity. It handles sending and receiving data packets over wired networks, offloads network processing tasks from the CPU, and is responsible for efficient, low-latency communication between devices. Our Ethernet products complement our Intel Xeon processors - the processors run the workloads, and the Ethernet controller moves the data efficiently across networks. Our Ethernet product lines, including Intel Ethernet Controllers & Network Adapters of E800 series and E600 series, support advanced features like RDMA, precision timing, hardware-based security and programmable packet processing for Network Functions Virtualization, storage, HPC and AI workloads. Additionally, our infrastructure processing units (IPUs) provide programmable networking capabilities, reducing CPU overhead and improving overall system efficiency. The IPUs are manufactured at an external foundry, on process nodes that vary by product. Alongside hardware, we provide software frameworks that are designed to integrate tightly with our networking silicon to improve throughput, latency and scalability. We continue to drive the transformation from fixed-function networks onto Intel Xeon processors coupled with our FlexCore and FlexRANTM software. Our software-based cloud RAN Platform is designed to allow operators to deploy the fastest cloud-native 5G infrastructure quickly and efficiently to meet the needs of their end customers.\n\nOur software portfolio is a key differentiator for our DCAI business, enabling customers to unlock the full potential of our platforms across cloud, edge, and enterprise deployments. In 2025, we accelerated delivery of data center software and developer tools, focusing on AI, HPC, and platform optimization. In addition, we expanded support for leading AI frameworks-including PyTorch, TensorFlow, Hugging Face, and vLLM-optimized for our server CPUs, GPUs and accelerators.\n\n## Disaggregated Architecture and Supply Chain\n\nWe have adopted a disaggregated design architecture for most of our newer and higher-end products, including all of our current Intel Core Ultra products and server CPUs, as well as a number of our future products, in which a number of chips, or tiles, are integrated into a single product using advanced packaging technologies. This approach provides flexibility in design where each tile can be manufactured utilizing the most appropriate semiconductor manufacturing process technology based on performance, cost and other considerations. It also allows for the use of smaller tiles, which increases yield in the manufacturing process, and more flexibility in the mixing of tiles to provide a wider range of products tailored to customer needs. This approach, however, introduces new areas of complexity in design and manufacturability, particularly in the deployment of advanced packaging technologies, and increases costs as compared to the monolithic architectures using a single primary tile. In addition, a disaggregated approach often requires advanced substrates and other materials that can create additional manufacturing challenges when supply is constrained, as is the situation currently.\n\nOur product offerings are predominantly manufactured in our own facilities, located in the U.S. and internationally, using our proprietary process technologies. In recent years, however, we have also strategically utilized third-party foundry manufacturing capacity, including at one of our key foundry competitors, TSMC, for various tiles or an entire product where advantageous for cost, performance, schedule or other considerations. This approach provides flexibility and scale, including in recent years the ability to offer products at the most performant end of the spectrum where comparable internal process technologies were not yet available. We expect to continue to use TSMC and other third-party foundry suppliers for various key tiles in a number of current and future products.\n\n## Foundry\n\nWe manufacture the majority of our CCG and DCAI semiconductor products internally and market semiconductor manufacturing offerings to external customers through our Intel Foundry business, which is comprised of our technology development, manufacturing and foundry services groups. We are one of only a few companies in the world with the process technology and manufacturing capabilities required to produce leading-edge semiconductor logic chips, and we are the only company that conducts both leading-edge logic semiconductor process technology R&D and manufacturing in the U.S.\n\nThe manufacture of semiconductor products has two primary steps:\n\n\u25aa wafer fabrication, which takes place in the clean rooms of our fabs, whereby a semiconductor chip design is implemented in silicon wafers using the process technology node for which a chip has been designed and the fab has been equipped to implement. Intel Foundry's process technologies are differentiated from one another and the process technologies of competing foundries based upon the characteristics of the node, including performance, power efficiency, and cost-effectiveness, and generally improve with each successive node. Each process technology node is developed, tested, ramped to high-volume production and continuously optimized; and\n\n\u25aa packaging, assembly and test, which typically takes place in other dedicated facilities, whereby the individual semiconductor chips, or die, are separated from the silicon wafer, assembled with any other die needed to complete the product or system, and packaged into a product for customers, with testing at multiple steps in the process. With the increased industry use of disaggregated design architectures utilizing interconnected chiplets optimized for specific workloads, we have developed a variety of advanced packaging techniques that we implement in some of our facilities to enable increasingly complex systems.\n\nNearly all of our foundry manufacturing capacity is dedicated to manufacturing our CCG and DCAI semiconductor products. However, one of our core strategic priorities is to leverage our U.S.-based capabilities in leading-edge semiconductor process technology development and manufacturing and advanced packaging to become a trusted foundry partner to third-party semiconductor customers. Potential customers include traditional fabless semiconductor companies in the computing, smartphone, cloud services, automotive, communications, aerospace and defense markets, as well as hyperscalers and the U.S. government. Our foundry offerings provide these external organizations with the ability to design and manufacture their semiconductor products using our process technologies and related packaging, assembly and test services, and also enable customers to utilize our advanced packaging services for wafers produced by other foundries. In 2024, we announced a strategic collaboration with UMC to develop a 12 nm process platform that expands our mature\u2010node process portfolio and strengthens our U.S.-based manufacturing foundry capabilities, with production expected to begin in 2027.\n\nSemiconductor manufacturing of leading-edge semiconductors is highly capital intensive, particularly the R&D for next generation nodes and the node development, testing and ramping to high-volume production, as well as building the manufacturing facilities needed for high-volume production, including both the facility shells and the advanced production tools. Investments are required years in advance of a return, and achieving favorable returns generally requires that a node be continually optimized over a long lifespan. Our external foundry strategy is driven by a need for additional volume for leading-edge node development and manufacturing capacity from customers seeking leading-edge capacity, beyond that of our products group, as well as a need for external customers for established node manufacturing capacity to extend the lifespan of such capacity as our product groups move to more advanced nodes.\n\n## Process Technology\n\nOur technology development group, with its R&D, fabs and other manufacturing facilities in Oregon, designs and develops each new process technology node from conception to high-volume production and supports the gradual transition of high-volume production to one of our other high-volume manufacturing sites. The continued development of leading-edge nodes that are competitive with the offerings of other foundries requires significant ongoing capital investment as we pursue incremental improvements and refinements of existing transistor and layout designs and manufacturing technologies, such as EUV lithography, while also pursuing new transistor and layout designs, such as gate-all-around and backside power in our Intel 18A process node and new manufacturing technologies, such as high-NA EUV lithography for use in the development of our Intel 14A process node. Where we historically moved quickly from node to node and did not make significant changes to nodes once they were in high-volume production, with the significantly higher capital intensity of semiconductor manufacturing in recent years and intense competitive environment, we have shifted our approach and now aim to extend the lifespan of each node and continuously improve yields of products being manufactured on each node through continued development and optimization. Through such continuous improvements, finding additional uses of older nodes for our products (including through our disaggregated architecture approach), and seeking external customers for older nodes through our external foundry strategy, we aim to extend the utilization of our manufacturing asset base.\n\nOur leading-edge process technology, which we use to manufacture our CCG and DCAI product offerings and also offer to external customers, is an important tenet of our strategy. Our principal current and planned future nodes consist of the following:\n\n\u25aa Intel 7, which first went into high-volume manufacturing in 2017 and has undergone a number of enhancements over its lifespan, continues in production for our 13th and 14th Gen Intel Core processors. Intel 7 was utilized for the majority of our internal processor production and products by revenue in 2025 and is expected to continue to be utilized for almost half of our internal processor production and products by revenue in 2026.\n\n\u25aa Intel 4 , our first process node incorporating EUV lithography, first went into high-volume manufacturing in 2023 and delivered significant scaling improvements over Intel 7. Intel 4 is utilized for our internal production of Intel Core Ultra Series 1 processors and represented a modest portion of our internal processor production and products by revenue in 2025, with its percentage contribution expected to decrease in 2026 as sales of processors using more advanced process technologies increase.\n\n\u25aa Intel 3 , a derivative node of Intel 4 that delivers enhanced performance over Intel 4, first went into high-volume manufacturing in 2024. Intel Xeon 6 Scalable server processor offerings are manufactured using this node. This node represented a modest portion of our internal processor production and products by revenue in 2025, with its percentage contribution expected to increase in 2026.\n\n\u25aa Intel 18A, currently our most advanced leading-edge node, first went into high-volume manufacturing in late 2025 and delivers significant improvements in performance per watt and density scaling over Intel 3. Intel 18A introduced two breakthrough technologies: RibbonFET and PowerVia. RibbonFET, our implementation of a gate-all-around transistor, is designed to deliver faster transistor switching speeds while achieving the same drive current as multiple fins of prior finFET transistor architectures, but in a smaller footprint. PowerVia is our unique industry-first implementation of backside power delivery that is designed to optimize signal transmission by eliminating the need for power routing on the front side of the wafer. Intel 18A is utilized for our first Intel Core Ultra Series 3 processor, the latest generation of our Intel Core Ultra processor family, and is expected to represent an increasing portion of our processor production and products by revenue in 2026 and subsequent years. We expect Intel 18A and its derivative nodes, notably Intel 18A-P, to be the key manufacturing process technology for multiple generations of our future client and server CPU products. We are seeking to establish Intel 18A as our first significant foundry node for government and commercial customers.\n\n\u25aa Intel 14A , our next-generation leading-edge node, is being designed to potentially incorporate an industry-first use of high-NA EUV lithography in high-volume semiconductor logic manufacturing. The new node is in active development, builds on the architectural innovations of Intel 18A and is designed to deliver further improvements in performance-per-watt and density scaling improvements over Intel 18A. We are actively seeking customers for Intel 14A, which is our first node designed from inception for offering to external customers. However, the development and manufacturing of next-generation leading-edge nodes like Intel 14A is highly capital intensive and their cost structure requires wafer volumes beyond what we expect from our own products to achieve economic efficiency. As such, in 2025 we announced that if we are unable to secure a significant external foundry customer for Intel 14A, we may pause or discontinue our pursuit of next generation leading-edge process technologies. We continue to evaluate Intel 14A for use in future Intel products and our plan includes an initial product designed to utilize Intel 14A, though we are maintaining the option to utilize an external foundry for future Intel products requiring nodes with performance beyond Intel 18A and Intel 18A-P.\n\n## Packaging Technology\n\nOur semiconductor packaging technologies represent another key to our strategy. Many of our internal products, as well as the most advanced products of potential external Intel Foundry customers, utilize disaggregated architectures that integrate multiple die, or tiles, into a single product through leading\u2010edge packaging. EMIB, which entered high\u2010volume manufacturing in 2017, supports high\u2010density 2.5D integration, and we introduced EMIB\u2010T in 2025, with adoption expected to scale beginning in 2026. EMIB\u2010T enhances the original EMIB technology by providing improved power delivery and bandwidth scalability to support larger package formats and next\u2010generation memory. We continued to invest in Foveros, our three\u2010dimensional die\u2010stacking technology first introduced in 2019, which has expanded to include Foveros\u2010B and Foveros\u2010R, both targeted for high\u2010volume manufacturing in 2027, as well as Foveros\u2010S for high\u2010speed I/O disaggregation. These Foveros variants aim to increase interconnect flexibility, cost efficiency, and integration density compared with earlier implementations. We also continued development of Foveros Direct, announced in 2025, with hybrid\u2010bonding support planned on our Intel 18A\u2010PT process in 2028, aimed at enabling higher interconnect density and lower energy usage.\n\n## Manufacturing\n\nWe operate a number of fabs and assembly and test facilities that support high-volume production of advanced logic chips. Once a new process technology is developed and achieves high-volume production at our Oregon R&D facilities and fabs, we generally add high-volume manufacturing at one or more of our other production fabs. Over time, we reallocate space and equipment in Oregon to our next generation process technologies. We are committed to initiating improvements in the utilization of our asset base. Recently, in addition to our Oregon location performing R&D on our latest and next generation process nodes, we are utilizing our Oregon fab assets to perform high volume manufacturing. Relatedly, fab locations that historically performed high-volume manufacturing exclusively are now also focused on an annual cadence of R&D-driven performance and cost improvements as we strive to meaningfully increase the useful life of existing nodes in production. In 2025, our key production fabs were in Oregon (ramping Intel 18A), Arizona (Intel 7 and ramping Intel 18A), Ireland (Intel 4 and Intel 3) and Israel (Intel 7). Finished wafers from our production fabs are then sent to our assembly and test facilities where the individual die are packaged and the finished semiconductor is tested. In 2025, our key assembly and test facilities were in China, New Mexico, Vietnam and Malaysia, with New Mexico being our key advanced packaging facility and a new advanced packaging facility being built in Malaysia. Maintaining reliable production capacity across these facilities is critical to meeting customer demand.\n\nSemiconductor manufacturing is a capital-intensive industry. From 2021 through 2024, we made substantial investments across three categories: technology development, manufacturing facility shells and advanced production tools. These investments were made to accelerate the development of our most advanced process technologies as we aimed to catch up with our leading manufacturing competitor on process technology, establish \"shell ahead\" capacity for anticipated future market demand and adopt EUV lithography for our leading-edge nodes. In 2025, we transitioned to a more disciplined capital deployment strategy, better aligning new investments and key project milestones with market demand. This shift reflects our focus on balancing innovation and capacity growth with operational and financial efficiency. As part of this approach, in 2025 we initiated the consolidation of our Costa Rican assembly and test operations into larger existing sites in Vietnam and Malaysia, which we expect to be completed by the end of 2026, slowed the pace of construction for our new Ohio fab and discontinued planned expansions in Germany (fab) and Poland (assembly and test) to better align capital spending with market demand. These actions reflect our focus on deploying capital in coordination with tangible milestones and scaling capacity as needed.\n\n## Supply Chain\n\nOur development of new process technologies and our manufacturing operations rely on a global supply chain encompassing thousands of suppliers worldwide. We source various critical semiconductor development and manufacturing tools and materials, including rare earth elements, minerals and metals, from multiple suppliers. In some cases, however, we are reliant upon sole-source providers, such as with the EUV lithography tools manufactured by ASML that are required for leading-edge process technologies, or providers that are substantially concentrated in a single country, such as with certain rare earth minerals critical to the functioning of a range of technology products and processes where China is the primary source of global supply. We seek to maintain close relationships with key suppliers to address capacity constraints, quality issues and potential supply chain risks, and actively monitor global supply conditions, diversify sourcing and reduce geographic dependencies where possible. Nevertheless, the semiconductor supply chain remains subject to volatility, including potential shortages of raw materials, extended lead times and price fluctuations. Additionally, trade disputes, geopolitical tensions, economic conditions and other events may further impact availability and cost. We continue to work with suppliers and governments to strengthen supply chain resilience and support a geographically balanced semiconductor ecosystem.\n\n## Sales and Marketing\n\nOur sales and marketing efforts primarily focus on our CCG and DCAI CPU and related semiconductor solutions, which are incorporated into computing and related end products and services used globally by consumers, enterprises, governments and educational organizations. Accordingly, this discussion centers on this significant portion of our business.\n\n## Customers\n\nWe design, market, sell and service CPUs and other semiconductor solutions substantially through our Intel Products business that are manufactured by our Intel Foundry business and other suppliers and are incorporated in computing and related end products and services, and utilized globally by consumers, enterprises, governments and educational organizations. We sell our products primarily to OEMs, ODMs and CSPs. ODMs provide design and manufacturing services to branded and unbranded private-label resellers. In addition, our customers include other manufacturers and service providers, such as industrial and communication equipment manufacturers and CSPs who buy our products through distributor, reseller, retail and OEM channels throughout the world. For information on customers who accounted for greater than 10% of our consolidated net revenue, see \"Note 3: Operating Segments\" within Notes to Consolidated Financial Statements.\n\nOur worldwide reseller sales channel consists of thousands of indirect customers-systems builders that purchase Intel processors and other products from our distributors. Certain of our microprocessors and other products are also available in direct retail outlets.\n\n## Sales Arrangements\n\nOur products are sold through distribution channels throughout the world. Sales of our products are frequently made via purchase order acknowledgments that contain standard terms and conditions covering matters such as pricing, payment terms and warranties, as well as indemnities for issues specific to our products, such as patent and copyright indemnities. Because our customers generally order from us on a purchase order basis, they can typically cancel, change or delay product purchase commitments with little or no notice to us and without penalty. From time to time, we may enter into additional agreements with customers covering, for example, changes from our standard terms and conditions, new product development, long term supply arrangements and marketing and private-label branding. Our sales are routinely made using electronic and web-based processes that allow customers to review inventory availability and track the progress of specific goods ordered. Pricing on particular products may vary based on volumes ordered and other factors. We also offer discounts, rebates and other incentives to customers to increase acceptance of our products and technology.\n\nIn accordance with contract terms, the revenue for combined performance obligations and standalone product sales is recognized at the time of product shipment from our facilities or delivery to the customer location, as determined by the agreed-upon shipping terms. Our standard terms and conditions of sale typically provide that payment is due at a later date, usually 30 days after shipment or delivery. We assess credit risk through quantitative and qualitative analysis. From this analysis, we establish shipping and credit limits and determine whether we will seek to use one or more credit support protection devices, such as obtaining a parent guarantee, standby letter of credit or credit insurance. Credit losses may still be incurred due to bankruptcy, fraud or other failure of the customer to pay.\n\n## Distribution\n\nDistributors typically handle a wide variety of products, including those that compete with our products, and fill orders for many customers. Customers may place orders directly with us or through distributors. We have several distribution warehouses that are located in proximity to key customers.\n\n## Seasonal Trends\n\nHistorically, our net revenue has typically been higher in the second half of the year than in the first half of the year, accelerating in the third quarter and peaking in the fourth quarter. In 2025, this trend was disrupted by our Q3 2025 divestiture of Altera (see \"Note 10: Acquisitions and Divestitures\" within Notes to Consolidated Financial Statements for further information). Net revenue seasonality in 2024 and 2023 was directionally consistent with the historical trend.\n\n## Marketing\n\nOur global marketing objectives are to strengthen our leadership as a trusted, innovative technology partner by building a bold, differentiated and well-known corporate brand that drives preferences across businesses and consumers. The Intel Core Ultra, Intel Core and Intel Xeon processor families remain our flagship CPU brands.\n\nIn 2025, we focused on accelerating brand awareness and demand generation through our own direct marketing and co-marketing programs with partners. Our direct marketing activities primarily include advertising through digital and social media, as well as consumer and trade events, industry and consumer communications and public relations. We market to consumer and commercial audiences. Our key messaging reinforces the Intel brand pillars of exceptionally engineered, collaboratively innovative and responsibly built.\n\nCertain customers participate in cooperative advertising and marketing programs. These cooperative advertising and marketing programs broaden the reach of our brands beyond the scope of our own direct marketing. Certain customers are licensed to place Intel \u00ae logos on computing devices containing our microprocessors and processor technologies and to use our brands in their marketing activities. The program partially reimburses customers for marketing activities for products featuring Intel brands, subject to customers meeting defined criteria. These marketing activities primarily include advertising through digital and social media and television, as well as press relations and at customer and trade events.\n\nR&D and IP\n\n## Research and Development\n\nR&D investment is essential to our strategic initiatives, including advancing our technology roadmap, delivering leadership products and developing next-generation process technologies. R&D expenses were $13.8 billion in 2025, $16.5 billion in 2024 and $16.0 billion in 2023. In 2025, our R&D investments focused on AI integration, heterogeneous computing architectures and next-generation process technologies, including Intel 18A and Intel 14A. We prioritized efficiency through IP reuse, advanced packaging and software-first co-design. Ecosystem partnerships and automation, including AI-driven design tools, supported innovation. We seek to protect our R&D efforts through IP rights and may, from time to time, augment these initiatives through acquisitions, strategic investments, R&D agreements and the direct purchase or licensing of technology.\n\n## Intellectual Property\n\nWe own and develop significant IP and related IP rights around the world that support our products, services, R&D and other activities and assets. Our IP portfolio includes patents, copyrights, trade secrets, trademarks, mask works and other rights. We actively seek to protect our global IP rights and deter unauthorized use of our IP and other assets.\n\nWe have obtained patents in the U.S. and other countries. Because of the fast pace of innovation and product development, our products are often obsolete before the patents related to them expire, and in some cases our products may be obsolete before the patents are granted. As we expand our product offerings, particularly around our foundry business, we also seek to extend our patent development efforts. In addition to developing patents based on our own R&D efforts, we may purchase or license patents from third parties.\n\nThe software that we distribute, including software embedded in our products, is entitled to copyright and other IP protection. To distinguish our products from our competitors' products, we have obtained trademarks and trade names for our products, and we maintain cooperative advertising programs with customers to promote our brands and to identify products containing genuine Intel components. We also protect details about our processes, products and strategies as trade secrets, keeping confidential the information that we believe provides us with a competitive advantage.\n\nEfforts to protect our IP can be difficult, particularly in countries that provide less protection to IP rights and in the absence of harmonized international IP standards. Competitors and others may already have IP rights covering similar products. There is no assurance that we will be able to obtain IP rights covering our own products or that we will be able to obtain IP licenses from other companies on favorable terms or at all. For a discussion of IP-related risks, see \"Risk Factors\" within Risk Factors. While our IP rights are important to our success, our business as a whole is not significantly dependent on any single patent, copyright or other IP right.\n\n## People\n\nOur people are fundamental to our success. Delivering on our strategy and growth ambitions requires attracting, developing and retaining top talent across the world. We strive to create an inclusive workplace where the world's best engineers and technologists can fulfill their dreams and create technology that delights our customers, delivers value for our stockholders and improves the life of every person on the planet. We invest in our highly skilled workforce, which was comprised of 85,100 1 people as of December 27, 2025, by creating practices, programs and benefits that support the rapidly changing world of work and our employees' needs.\n\n## Cultural Transformation\n\nIn 2025, we initiated a company-wide cultural transformation designed to enhance agility, accountability and technical focus across our product and operational teams. As part of this effort, we streamlined organizational structures by reducing management layers and simplifying decision-making processes. These changes were implemented to accelerate execution, foster a more responsive workforce and improve alignment with strategic priorities. We placed increased emphasis on technical excellence, disciplined execution and customer impact, reinforcing a culture that prioritizes speed, clarity and innovation. These initiatives are an important element of our strategy and are intended to support long-term competitiveness and operational efficiency as we advance our product and process technology roadmaps and deliver differentiated computing solutions. As part of this transformation, we also evolved our workplace model to strengthen collaboration and execution, with employees generally expected to be on-site at least four days per week. This change is intended to support business priorities and foster vibrant hubs of teamwork and innovation. We believe the benefits of in-person collaboration, including stronger teams, faster decision-making and greater innovation, are essential to our long-term success.\n\n## Talent Management\n\nWe continue to see significant competition for talent throughout the semiconductor industry. In 2025, we limited hiring in line with our financial performance and cost-reduction measures and implemented headcount reductions under our 2025 Restructuring Plan. However, our investments to advance both process technology and our product roadmap require focused efforts to attract and retain talent, particularly in technical roles. Our undesired turnover rate 2 was 7.9% in 2025 and 5.9% in 2024.\n\nWe invest resources to develop the talent needed to remain at the forefront of innovation and make us an employer of choice. We offer training programs and provide rotational assignment opportunities. Our job architecture is designed to help employees create custom learning curricula for building skills and owning their careers. To further support the growth and development of our people, we offer mentoring in our technical community and promote engagement and health and wellness resources with all our people. Through our periodic employee experience survey, pulse surveys and a manager pulse tool, employees can voice their perceptions of the company, their managers, their work experiences and their learning and development opportunities. Our employees' voices are important to enable our culture of continuous improvement, and as a result, we link a portion of our executive and employee performance bonus to metrics focused on activating and empowering our talent through improved morale, engagement and retention. Our business depends on how we engage, manage and reward our people. Our performance management system is designed to support our culture and to increase our focus on disciplined execution.\n\nInclusion is a core element of our values and instrumental to driving innovation and positioning us for growth. We aim to create a workplace where individuals from all backgrounds are not only respected and valued but also challenged, acknowledged, rewarded and empowered to reach their highest potential.\n\n1 Employee headcount includes our core Intel workforce as well as employees at Mobileye and other subsidiaries.\n\n2 Undesired turnover includes all regular Intel employees who voluntarily left Intel, but does not include Intel contract employees, interns or employees who separated from Intel due to divestiture, retirement, voluntary separation packages, death, job elimination or redeployment, or Mobileye and other non-integrated subsidiaries employees.\n\n## Compensation and Benefits\n\nWe structure pay, benefits and services to meet the varying needs of our employees, helping support employee financial well-being with competitive compensation, investment opportunities and financial resources. Our total rewards package includes market-competitive pay, broad-based stock grants and bonuses, an employee stock purchase plan, healthcare and retirement benefits, paid time off and family leave, parent reintegration, family expansion assistance, flexible work schedules, sabbaticals and on-site services. We believe that our holistic approach toward compensation, career development and creating an inclusive culture enables us to cultivate a workplace that helps employees develop and progress in their careers at all levels.\n\n## Health, Safety and Wellness\n\nWe are committed to providing a safe and injury-free workplace. We regularly invest in programs designed to improve physical, mental and social well-being. We provide access to a variety of innovative, flexible and convenient health and wellness programs, including on-site health centers, and we aim to increase awareness of and support for mental and behavioral health. We offer various ergonomic programming, include return-to-office ergo to support wellness in the office. Employees are encouraged to join employee resource groups for community and connection, use the employee assistance program for matters impacting personal and professional life, or the modern health program for mental well-being. We intend to continue our efforts to build our strong safety culture and drive the global expansion of our corporate wellness program through employee education and engagement activities.\n\n## Corporate Responsibility\n\nWe believe that responsible business practices strengthen our position as a global corporate citizen and create shared value for our company, our supply chain, and our stakeholders, including our customers and communities. Unlike many companies in the technology industry that outsource their production, we manufacture the majority of our products in our own wafer fabrication and back-end assembly and test facilities. This approach means our direct environmental footprint is more significant than those of our fabless competitors, whose impacts sit in their supply chains. However, it also gives us a unique advantage: direct control over manufacturing processes, enabling us to integrate sustainable practices at the core of production.\n\nManaging our sustainable business practices helps us reduce cost, optimize efficiencies, strengthen supply chain resilience and meet stakeholder expectations. We invest in environmental projects and set company-wide ambitions to cut greenhouse gas emissions, energy and water use and waste to landfills. Our products are designed with energy efficiency in mind, to help customers lower their own emissions, energy usage and costs.\n\nOur supply chain practices are designed to drive responsible and sustainable business practices through robust education and engagement initiatives for suppliers, supporting our global manufacturing operations. We collaborate with industry peers to improve transparency around climate and water impacts in the electronics supply chain, and lead efforts on responsible minerals sourcing. These collaborations help establish industry-wide standards, develop auditable processes and deliver training that drives meaningful change.\n\nOur commitment to integrity, accountability and responsible business practices applies to every employee. All employees are expected to uphold the Intel Code of Conduct and Intel's Global Human Rights Principles, which form the foundation of our policies, practices and ethical business culture.\n\n## Human Rights Commitment\n\nWe are committed to maintaining and improving systems and processes to avoid causing or contributing to adverse impacts on human rights in our operations, products and supply chain. Our integrated approach includes senior management involvement and board-level oversight. We also engage throughout the year with external stakeholders and experts to inform and evolve our policies and oversight processes. While we do not always know nor can we control what products our customers create or the applications end users may develop, we do not support or tolerate our products being used to adversely impact human rights. Where we become aware of a concern that our products are being used by a business partner in connection with abuses of human rights, we intend to evaluate and restrict or cease business with the third party unless and until we have high confidence that our products are not being used to adversely impact human rights.\n\nOver the past decade, we have directly engaged with suppliers to verify compliance and build operational capacity to address risks of forced and bonded labor and other human rights issues. We conduct periodic supplier audits and engage critical direct suppliers through capability-building programs aligned with the Responsible Business Alliance and the Intel Code of Conduct. Additionally, we extend these efforts to indirect suppliers through initiatives focused on forced and bonded labor, responsible minerals and supply chain resilience.\n\n## Energy\n\nWe focus on reducing our own environmental footprint, which helps deliver financial and customer value. Over the past two decades, we have reduced our direct and indirect greenhouse gas emissions associated with energy consumption, lowering operational costs and improving efficiency. Our investments include renewable electricity and on-site alternative energy projects. In 2025, we reinforced accountability by tying a portion of executive and employee performance bonuses to achieving our target of 95% global renewable electricity use as of December 31, 2025. We continue to pursue emissions abatement and invest in renewable electricity, process and equipment optimization and energy conservation. Beyond our operations, we focus on addressing climate impacts upstream and downstream in the value chain by improving the energy efficiency of our products and leveraging Intel technologies to help other sectors reduce their climate and energy footprints.\n\n## Water\n\nWater is critical to semiconductor manufacturing. We use ultrapure water to remove impurities from our silicon wafers and fresh or reclaimed water for facility systems. Guided by our Global Water Policy, our strategy is designed to optimize resource use, reduce costs and mitigate operational risks associated with water scarcity. By managing water responsibly, we aim to meet our business needs while supporting the communities where we operate.\n\n## Waste\n\nWe have long been committed to waste management, recycling and circular economy strategies that enable the recovery and productive re-use of waste streams. We continue to focus on opportunities to upcycle waste by improving waste segregation practices and collaborating with our suppliers to evaluate new technologies for waste recovery.\n\n## Governance and Disclosure\n\nWe aim to provide transparency around our carbon footprint and climate risks using the TCFD framework to inform our disclosure on governance, strategy, risk management and metrics. Our integrated approach involves multiple teams, senior management and board-level oversight through the Corporate Governance and Nominating Committee. Climate-related risks and opportunities are detailed in our annual Corporate Responsibility Report, Global Climate Change Policy, Climate Transition Action Plan and \"Risk Factors\" within this Form 10-K. The Corporate Responsibility Report also maps our disclosure to TCFD, GRI and SASB frameworks and is published annually along with CDP Questionnaire on our website. 1 We continue to be subject to evolving climate-related disclosure requirements in multiple jurisdictions.\n\n1 The contents of our website and our Corporate Responsibility Report, Global Climate Change Policy, Climate Transition Action Plan, and CDP Climate Change and Water Surveys are referenced for general information only and are not incorporated by reference in this Form 10-K.\n<\/document>\n<\/documents>"}};
const KEY = "labels:" + DATA.set_id;
let labels = JSON.parse(localStorage.getItem(KEY) || "{}");
let idx = Math.min(parseInt(localStorage.getItem(KEY + ":idx") || "0"), DATA.items.length - 1);
const $ = id => document.getElementById(id);
function el(tag, cls, text){const e=document.createElement(tag); if(cls) e.className=cls; if(text!==undefined) e.textContent=text; return e;}
function save(){localStorage.setItem(KEY, JSON.stringify(labels)); localStorage.setItem(KEY+":idx", idx);}
function cur(){return DATA.items[idx];}
function render(){
  const it = cur(), r = DATA.rubrics[it.criterion];
  $("pos").textContent = "Item " + (idx+1) + " of " + DATA.items.length;
  const done = Object.keys(labels).filter(k => labels[k].verdict).length;
  $("count").textContent = done + " labeled"; $("progfill").style.width = (100*done/DATA.items.length) + "%";
  $("title").textContent = r.title; $("guide").textContent = r.guide; $("rubric").textContent = r.rubric;
  const refbox = $("ref"); if(it.reference){refbox.style.display="block"; refbox.textContent = "Reference: " + it.reference;} else refbox.style.display="none";
  const c = $("convo"); c.textContent = "";
  it.conversation.forEach((m, i) => {
    const last = i === it.conversation.length - 1;
    c.appendChild(el("div", "role", (m.role === "user" ? "User" : "Assistant") + (last ? "  (judge this message)" : "")));
    c.appendChild(el("div", "msg " + (m.role === "user" ? "user" : "assistant") + (last ? " final" : ""), m.content));
  });
  const dw = $("docwrap"); if(it.docs_key){dw.style.display="block"; $("docs").textContent = DATA.docs[it.docs_key]; $("docs").style.display="none"; $("docbtn").textContent="Show filing text";} else dw.style.display="none";
  const b = $("btns"); b.textContent = "";
  const lab = labels[it.id] || {};
  r.options.forEach((o, k) => {
    const btn = el("button", (lab.verdict === o[0] ? "sel " + (o[0]==="fail"?"f":o[0]==="not_applicable"?"n":"") : ""), (k+1) + ". " + o[1]);
    btn.onclick = () => choose(o[0]); b.appendChild(btn);
  });
  $("border").checked = !!lab.borderline; $("note").value = lab.note || "";
  const g = $("grid"); g.textContent = "";
  DATA.items.forEach((x, k) => {const s = el("span", (labels[x.id] && labels[x.id].verdict ? "done " : "") + (k===idx ? "cur" : ""), k+1); s.onclick = () => {idx=k; save(); render();}; g.appendChild(s);});
  save();
}
function setLabel(patch){const id = cur().id; labels[id] = Object.assign({}, labels[id] || {}, patch, {at: new Date().toISOString()}); save();}
function choose(v){setLabel({verdict: v}); render();}
$("border").onchange = e => {setLabel({borderline: e.target.checked}); };
$("note").oninput = e => {setLabel({note: e.target.value});};
function go(d){idx = Math.max(0, Math.min(DATA.items.length-1, idx+d)); save(); render(); window.scrollTo(0,0);}
function toggleDocs(){const d=$("docs"); const show = d.style.display==="none"; d.style.display = show?"block":"none"; $("docbtn").textContent = show?"Hide filing text":"Show filing text";}
document.addEventListener("keydown", e => {
  if(e.target.tagName==="TEXTAREA") return;
  if(e.key==="ArrowRight") go(1); else if(e.key==="ArrowLeft") go(-1);
  else if(e.key.toLowerCase()==="b"){const c=$("border"); c.checked=!c.checked; setLabel({borderline:c.checked});}
  else if("123".includes(e.key) && e.key){const o=DATA.rubrics[cur().criterion].options[parseInt(e.key)-1]; if(o) choose(o[0]);}
});
function exportLabels(){
  const out = {label_set: DATA.set_id, exported_at: new Date().toISOString(), n_items: DATA.items.length, labels: labels};
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([JSON.stringify(out, null, 1)], {type:"application/json"}));
  a.download = "labels_" + DATA.set_id + "_" + new Date().toISOString().slice(0,16).replace(/[:T]/g,"-") + ".json"; a.click();
}
render();
</script></body></html>
